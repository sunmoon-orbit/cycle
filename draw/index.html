<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="/cycle/icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/cycle/icons/icon-192.png">
  <link rel="manifest" href="../manifest.webmanifest?v=20260216">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日月抽签 · 番茄钟联动</title>
  <meta name="theme-color" content="#A3B18A" />
  <style>
    :root{
      --bg:#E8E4DE;
      --card:#F5F2EE;
      --ink:#2E2E2E;
      --muted:#6E6A63;
      --line:#D7D1C9;
      --a:#A3B18A;   /* 雾绿 */
      --b:#9AA6B2;   /* 雾蓝灰 */
      --shadow:0 10px 28px rgba(0,0,0,.08);
      --r:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC","Noto Sans SC", Arial, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(900px 600px at 10% 0%, color-mix(in srgb, var(--a) 22%, transparent), transparent 60%),
        radial-gradient(900px 600px at 90% 10%, color-mix(in srgb, var(--b) 18%, transparent), transparent 60%),
        var(--bg);
      min-height:100vh;
      padding:16px 12px 40px;
    }
    .wrap{max-width:860px;margin:0 auto}
    .top{
      display:flex;gap:10px;align-items:center;
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:var(--r);
      background:rgba(245,242,238,.78);
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
    }
    .badge{
      width:34px;height:34px;border-radius:12px;
      background: conic-gradient(from 210deg, var(--a), var(--b), #CBBFAF, var(--a));
      display:grid;place-items:center;
      color:#fff;font-weight:800;user-select:none;
    }
    h1{margin:0;font-size:16px}
    .sub{margin-top:2px;font-size:12px;color:var(--muted);line-height:1.4}
    .tag{
      margin-left:auto;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.55);
      padding:6px 10px;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }

    
    .right{
      margin-left:auto;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .right .tag{margin-left:0}
    .themes{display:flex;gap:8px;align-items:center}
    .swatch{
      width:22px;height:22px;
      border-radius:999px;
      padding:0;
      border:1px solid var(--line);
      box-shadow:none;
      cursor:pointer;
    }
    .swatch[aria-pressed="true"]{
      border-color: color-mix(in srgb, var(--a) 70%, var(--line));
      box-shadow:0 10px 18px rgba(0,0,0,.06);
    }
    .swatch:active{transform:translateY(1px)}
    .swatch:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--a) 30%, transparent);}
.grid{
      margin-top:12px;
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }
    .card{
      border:1px solid var(--line);
      border-radius:var(--r);
      background:rgba(245,242,238,.78);
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
      padding:14px;
    }

    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    button{
      appearance:none;
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      padding:10px 12px;
      font-weight:760;
      color:var(--ink);
      box-shadow:0 10px 18px rgba(0,0,0,.06);
      cursor:pointer;
    }
    button:active{transform:translateY(1px)}
    button[disabled]{opacity:.55;cursor:not-allowed}
    .primary{
      background: linear-gradient(135deg, color-mix(in srgb, var(--a) 35%, white), color-mix(in srgb, var(--b) 20%, white));
      border-color: color-mix(in srgb, var(--a) 55%, var(--line));
    }
    .ghost{background:transparent;box-shadow:none}
    .pill{
      border:1px solid var(--line);
      background:rgba(255,255,255,.55);
      border-radius:999px;
      padding:8px 10px;
      font-size:12px;
      color:var(--muted);
      user-select:none;
    }

    .result{
      margin-top:10px;
      border-radius:18px;
      border:1px dashed color-mix(in srgb, var(--b) 55%, transparent);
      background:rgba(255,255,255,.55);
      padding:12px;
      min-height:72px;
    }
    .big{font-size:18px;font-weight:850;letter-spacing:.2px;word-break:break-word}
    .small{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.5}

    input, textarea{
      width:100%;
      border:1px solid var(--line);
      background:rgba(255,255,255,.7);
      border-radius:16px;
      padding:10px 12px;
      font-size:14px;
      color:var(--ink);
      outline:none;
    }
    textarea{min-height:140px;resize:vertical}
    .hint{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.5}

    /* Pomodoro */
    #pomoTime{
      margin-top:10px;
      border-radius:18px;
      border:1px dashed color-mix(in srgb, var(--a) 55%, transparent);
      background:rgba(255,255,255,.55);
      padding:14px 12px;
      text-align:center;
      font-weight:950;
      font-size:44px;
      letter-spacing:1px;
      font-variant-numeric: tabular-nums;
      user-select:none;
    }
    .kv{
      margin-top:12px;
      display:flex;
      flex-wrap:wrap;
      gap:10px 12px;
      align-items:center;
    }
    .kv label{
      display:flex;
      gap:8px;
      align-items:center;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }
    .kv input[type="number"]{
      width:84px;
      padding:8px 10px;
      border-radius:14px;
      font-size:13px;
    }
    .toggles{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .switch{
      display:flex;
      gap:8px;
      align-items:center;
      font-size:12px;
      color:var(--muted);
    }
    .switch input{
      width:auto;
      accent-color: var(--a);
    }

    /* Toast */
    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(40,20,80,.12);
      box-shadow: 0 10px 30px rgba(40,20,80,.12);
      color: var(--ink);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      max-width: 88vw;
      text-align:center;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }

    @media (min-width:780px){
      body{padding:24px 18px 50px}
      .grid{grid-template-columns:1.05fr .95fr}
      .big{font-size:22px}
      .result{min-height:140px}
      #pomoTime{font-size:54px}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="badge">☾</div>
      <div>
        <h1>日月抽签机</h1>
        <div class="sub">你可以自定义签筒。每行一条签，本地保存，不联网。</div>
      </div>
      <div class="right">
        <div class="themes" id="themeBar" aria-label="主题色">
          <button class="swatch" type="button" data-theme="fog"   title="雾绿" aria-pressed="true"  style="background:conic-gradient(from 210deg,#A3B18A,#9AA6B2,#CBBFAF,#A3B18A)"></button>
          <button class="swatch" type="button" data-theme="blue"  title="雾蓝" aria-pressed="false" style="background:conic-gradient(from 210deg,#8AA6C1,#A3B18A,#CBBFAF,#8AA6C1)"></button>
          <button class="swatch" type="button" data-theme="rose"  title="玫瑰" aria-pressed="false" style="background:conic-gradient(from 210deg,#D6A6A6,#9AA6B2,#CBBFAF,#D6A6A6)"></button>
          <button class="swatch" type="button" data-theme="lilac" title="丁香" aria-pressed="false" style="background:conic-gradient(from 210deg,#B6A6D6,#9AA6B2,#CBBFAF,#B6A6D6)"></button>
          <button class="swatch" type="button" data-theme="cocoa" title="可可" aria-pressed="false" style="background:conic-gradient(from 210deg,#B59C8C,#A3B18A,#CBBFAF,#B59C8C)"></button>
        </div>
        <div class="tag" id="bagName">默认签筒</div>
      </div>
    </div>

    <div class="grid">
      <!-- 抽签 -->
      <div class="card">
        <div class="row">
          <button class="primary" id="btnDraw">抽一签</button>
          <button class="ghost" id="btnCopy">复制结果</button>
          <button class="ghost" id="btnClearLast">清空展示</button>
          <span class="pill" id="stat">签数：0</span>
        </div>

        <div class="result">
          <div class="big" id="resultText">点“抽一签”</div>
          <div class="small" id="resultMeta">抽到就算数。反悔也行，但要对自己好一点。</div>
        </div>

        <div class="hint">
          小提示：签写成行动句更好玩，比如“喝水”“伸懒腰”“看窗外两分钟”“把手机放下”。🙂
        </div>
      </div>

      <!-- 自定义签筒 -->
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div style="font-weight:850">自定义签筒</div>
          <button class="ghost" id="btnReset">恢复默认签</button>
        </div>

        <div class="hint" style="margin-top:10px">签筒名字（可选）</div>
        <input id="bagTitle" placeholder="比如：小鹿的日月签" />

        <div class="hint" style="margin-top:10px">每行一条签（空行会自动忽略）</div>
        <textarea id="bagInput" spellcheck="false" placeholder="例如：
喝水
伸懒腰
看窗外两分钟
收拾桌面1分钟
早点睡"></textarea>

        <div class="row" style="margin-top:10px">
          <button class="primary" id="btnSave">保存签筒</button>
          <span class="pill" id="saveTip">保存后下次打开还在</span>
        </div>

        <div class="hint" style="margin-top:10px">
          你把签写好后点“保存签筒”。之后每次打开都会保留（除非浏览器清空了站点数据）。
        </div>
      </div>

      <!-- 番茄钟（联动抽签） -->
      <div class="card" id="pomoCard">
        <div class="row" style="justify-content:space-between">
          <div style="font-weight:850">番茄钟</div>
          <span class="pill" id="pomoPhase">专注</span>
        </div>

        <div id="pomoTime">25:00</div>

        <div class="row" style="margin-top:12px">
          <button class="primary" id="pomoStart">开始</button>
          <button class="ghost" id="pomoPause">暂停</button>
          <button class="ghost" id="pomoReset">重置</button>
          <button class="ghost" id="pomoSkip" title="跳过当前阶段">跳过</button>
        </div>

        <div class="kv">
          <label>专注(分钟) <input id="pomoWork" type="number" min="1" max="120" inputmode="numeric"></label>
          <label>短休 <input id="pomoShort" type="number" min="1" max="60" inputmode="numeric"></label>
          <label>长休 <input id="pomoLong" type="number" min="1" max="90" inputmode="numeric"></label>
          <label>每 <input id="pomoEvery" type="number" min="1" max="12" inputmode="numeric"> 次专注→长休</label>
        </div>

        <div class="toggles">
          <label class="switch"><input type="checkbox" id="pomoAutoNext">结束后自动开始下一段</label>
          <label class="switch"><input type="checkbox" id="pomoAutoDraw">专注结束 → 自动抽一签当奖励</label>
        </div>

        <div class="hint">
          你按“开始”后就会稳定计时（就算切到后台也不会乱）。专注结束会提醒你；如果勾选联动，会自动帮你点一次“抽一签”。(◍´꒳`◍)
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script>
    // ===== 抽签：本地存储 =====
    const LS_BAG = "sunmoon_draw_bag_v1";
    const LS_NAME = "sunmoon_draw_name_v1";
    const LS_LAST = "sunmoon_draw_last_v1";

    const defaultBag = [
      "喝点水。",
      "伸个懒腰，肩颈别硬扛。",
      "把手机放下两分钟，看看窗外。",
      "整理一个小角落，1分钟就行。",
      "洗把脸，重启一下人类进程。",
      "夸你自己一句，不许敷衍。",
      "发呆30秒，合法合规。",
      "给未来的你做一件小事。",
      "今天只要不更糟，就是胜利。"
    ];

    const $ = (id) => document.getElementById(id);

    // ===== 主题色：只换主色/辅色（不会影响你的数据）=====
    const LS_THEME = "sunmoon_draw_theme_v1";
    const THEMES = {
      fog:   { a:"#A3B18A", b:"#9AA6B2" }, // 雾绿
      blue:  { a:"#8AA6C1", b:"#A3B18A" }, // 雾蓝
      rose:  { a:"#D6A6A6", b:"#9AA6B2" }, // 玫瑰
      lilac: { a:"#B6A6D6", b:"#9AA6B2" }, // 丁香
      cocoa: { a:"#B59C8C", b:"#A3B18A" }  // 可可
    };

    function applyTheme(key){
      const t = THEMES[key] || THEMES.fog;
      document.documentElement.style.setProperty("--a", t.a);
      document.documentElement.style.setProperty("--b", t.b);
      localStorage.setItem(LS_THEME, key);

      // PWA / 地址栏颜色
      const meta = document.querySelector('meta[name="theme-color"]');
      if(meta) meta.setAttribute("content", t.a);

      // 小按钮选中态
      document.querySelectorAll(".swatch").forEach(btn=>{
        btn.setAttribute("aria-pressed", btn.dataset.theme === key ? "true" : "false");
      });
    }

    function initTheme(){
      document.querySelectorAll(".swatch").forEach(btn=>{
        btn.addEventListener("click", ()=> applyTheme(btn.dataset.theme));
      });
      const saved = localStorage.getItem(LS_THEME);
      applyTheme(saved && THEMES[saved] ? saved : "fog");
    }


    const bagName = $("bagName");
    const bagTitle = $("bagTitle");
    const bagInput = $("bagInput");
    const stat = $("stat");
    const resultText = $("resultText");
    const resultMeta = $("resultMeta");
    const saveTip = $("saveTip");

    initTheme();


    let toastTimer = null;
    function toast(msg){
      const t = $("toast");
      if(!t) return;
      t.textContent = msg;
      t.classList.add("show");
      if(toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
    }

    function safeParse(raw, fallback){
      try { return JSON.parse(raw); } catch { return fallback; }
    }

    function getBag(){
      const raw = localStorage.getItem(LS_BAG);

      // 第一次：没有任何保存，就写入默认签筒
      if(!raw){
        const d = defaultBag.slice();
        localStorage.setItem(LS_BAG, JSON.stringify(d));
        return d;
      }

      const bag = safeParse(raw, null);

      // 保存坏了 / 为空：修复为默认签筒，并重新写回本地
      if(!Array.isArray(bag) || bag.length === 0){
        const d = defaultBag.slice();
        localStorage.setItem(LS_BAG, JSON.stringify(d));
        return d;
      }

      return bag;
    }

    function getName(){
      return localStorage.getItem(LS_NAME) || "默认签筒";
    }

    function normalizeLines(text){
      return (text || "")
        .split("\n")
        .map(s => s.trim())
        .filter(Boolean);
    }

    function render(){
      const bag = getBag();
      const name = getName();

      bagName.textContent = name;
      bagTitle.value = (name === "默认签筒") ? "" : name;
      bagInput.value = bag.join("\n");
      stat.textContent = `签数：${bag.length}`;

      const last = localStorage.getItem(LS_LAST);
      if (last){
        resultText.textContent = last;
        resultMeta.textContent = "上次抽到的是它。想换就再抽一签。";
      }
    }

    function saveBag(){
      const lines = normalizeLines(bagInput.value);
      const bag = lines.length ? lines : defaultBag.slice();
      const name = (bagTitle.value || "").trim() || "默认签筒";

      try{
        localStorage.setItem(LS_BAG, JSON.stringify(bag));
        localStorage.setItem(LS_NAME, name);
        const check = localStorage.getItem(LS_BAG);
        if(!check) throw new Error("LS_BAG write failed");
      }catch(e){
        saveTip.textContent = "保存失败：浏览器阻止本地存储/被清空了";
        console.error(e);
        toast("保存失败：浏览器没让写本地存储");
        return;
      }

      bagName.textContent = name;
      stat.textContent = `签数：${bag.length}`;
      saveTip.textContent = "保存成功。";
      resultMeta.textContent = "签筒已保存，本地生效。";
      toast("已保存签筒");
    }

    function resetBag(){
      localStorage.setItem(LS_BAG, JSON.stringify(defaultBag));
      localStorage.setItem(LS_NAME, "默认签筒");
      saveTip.textContent = "已恢复默认签。";
      toast("已恢复默认签");
      render();
    }

    function drawOne(){
      const bag = getBag();
      const pick = bag[Math.floor(Math.random() * bag.length)];
      resultText.textContent = pick;
      resultMeta.textContent = "抽到就算数。反悔也行，但要对自己好一点。";
      localStorage.setItem(LS_LAST, pick);
    }

    async function copyResult(){
      const text = (resultText.textContent || "").trim();
      if (!text || text === "点“抽一签”") return;
      try{
        await navigator.clipboard.writeText(text);
        resultMeta.textContent = "复制好了。去执行。";
        toast("复制好了");
      }catch{
        resultMeta.textContent = "复制失败。长按也能复制。";
        toast("复制失败（可长按复制）");
      }
    }

    function clearLast(){
      localStorage.removeItem(LS_LAST);
      resultText.textContent = "点“抽一签”";
      resultMeta.textContent = "清空展示了。";
      toast("已清空展示");
    }

    $("btnDraw")?.addEventListener("click", drawOne);
    $("btnCopy")?.addEventListener("click", copyResult);
    $("btnClearLast")?.addEventListener("click", clearLast);
    $("btnSave")?.addEventListener("click", saveBag);
    $("btnReset")?.addEventListener("click", resetBag);

    render();

    // ===== 番茄钟：本地存储 + 抽签联动 =====
    const LS_POMO = "sunmoon_pomo_v1";

    const DEFAULT_POMO = {
      work: 25,
      short: 5,
      long: 15,
      every: 4,
      autoNext: true,
      autoDraw: true,

      phase: "work",   // work | short | long
      running: false,
      endAt: null,     // ms timestamp
      remaining: 25 * 60, // seconds
      doneWork: 0      // completed work sessions
    };

    function loadPomo(){
      const raw = localStorage.getItem(LS_POMO);
      const obj = safeParse(raw, null);
      const p = Object.assign({}, DEFAULT_POMO, (obj && typeof obj === "object") ? obj : {});
      // sanitize
      p.work = clampInt(p.work, 1, 120, 25);
      p.short = clampInt(p.short, 1, 60, 5);
      p.long = clampInt(p.long, 1, 90, 15);
      p.every = clampInt(p.every, 1, 12, 4);
      p.remaining = clampInt(p.remaining, 0, 24*3600, p.work*60);
      p.doneWork = clampInt(p.doneWork, 0, 9999, 0);
      if(!["work","short","long"].includes(p.phase)) p.phase = "work";
      if(typeof p.running !== "boolean") p.running = false;
      if(typeof p.endAt !== "number") p.endAt = null;
      return p;
    }

    function savePomo(p){
      localStorage.setItem(LS_POMO, JSON.stringify(p));
    }

    function clampInt(x, min, max, fallback){
      const n = Number.parseInt(x, 10);
      if(Number.isNaN(n)) return fallback;
      return Math.max(min, Math.min(max, n));
    }

    const pomoUI = {
      phase: $("pomoPhase"),
      time: $("pomoTime"),
      start: $("pomoStart"),
      pause: $("pomoPause"),
      reset: $("pomoReset"),
      skip: $("pomoSkip"),
      work: $("pomoWork"),
      short: $("pomoShort"),
      long: $("pomoLong"),
      every: $("pomoEvery"),
      autoNext: $("pomoAutoNext"),
      autoDraw: $("pomoAutoDraw"),
    };

    let pomo = loadPomo();
    let tickTimer = null;

    function phaseLabel(phase){
      if(phase === "work") return "专注";
      if(phase === "short") return "短休";
      return "长休";
    }

    function phaseSeconds(phase){
      if(phase === "work") return pomo.work * 60;
      if(phase === "short") return pomo.short * 60;
      return pomo.long * 60;
    }

    function fmt(sec){
      const s = Math.max(0, sec|0);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return String(m).padStart(2,"0") + ":" + String(r).padStart(2,"0");
    }

    function updatePomoUI(){
      if(pomoUI.phase) pomoUI.phase.textContent = phaseLabel(pomo.phase);
      if(pomoUI.time) pomoUI.time.textContent = fmt(pomo.remaining);
      if(pomoUI.start) pomoUI.start.disabled = pomo.running;
      if(pomoUI.pause) pomoUI.pause.disabled = !pomo.running;

      if(pomoUI.work) pomoUI.work.value = pomo.work;
      if(pomoUI.short) pomoUI.short.value = pomo.short;
      if(pomoUI.long) pomoUI.long.value = pomo.long;
      if(pomoUI.every) pomoUI.every.value = pomo.every;

      if(pomoUI.autoNext) pomoUI.autoNext.checked = !!pomo.autoNext;
      if(pomoUI.autoDraw) pomoUI.autoDraw.checked = !!pomo.autoDraw;

      // title hint
      document.title = (pomo.running ? ("⏳ " + fmt(pomo.remaining) + " · ") : "") + "日月抽签 · 番茄钟联动";
    }

    function computeRemaining(){
      if(!pomo.running || !pomo.endAt) return;
      const sec = Math.round((pomo.endAt - Date.now()) / 1000);
      pomo.remaining = Math.max(0, sec);
    }

    function startTick(){
      stopTick();
      tickTimer = setInterval(() => {
        computeRemaining();
        updatePomoUI();
        savePomo(pomo);
        if(pomo.running && pomo.remaining <= 0){
          finishPhase();
        }
      }, 250);
    }

    function stopTick(){
      if(tickTimer){
        clearInterval(tickTimer);
        tickTimer = null;
      }
    }

    function startPomo(){
      if(pomo.running) return;
      if(pomo.remaining <= 0) pomo.remaining = phaseSeconds(pomo.phase);
      pomo.running = true;
      pomo.endAt = Date.now() + pomo.remaining * 1000;
      savePomo(pomo);
      updatePomoUI();
      startTick();
    }

    function pausePomo(){
      if(!pomo.running) return;
      computeRemaining();
      pomo.running = false;
      pomo.endAt = null;
      savePomo(pomo);
      updatePomoUI();
      stopTick();
    }

    function resetPomo(){
      pomo.running = false;
      pomo.endAt = null;
      pomo.phase = "work";
      pomo.doneWork = 0;
      pomo.remaining = pomo.work * 60;
      savePomo(pomo);
      updatePomoUI();
      stopTick();
      toast("番茄钟已重置");
    }

    function switchTo(phase){
      pomo.phase = phase;
      pomo.running = false;
      pomo.endAt = null;
      pomo.remaining = phaseSeconds(phase);
      savePomo(pomo);
      updatePomoUI();
      stopTick();
    }

    function beep(){
      // best-effort: mobile may require user gesture (we already have clicks)
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = 880;
        g.gain.value = 0.0001;
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        const now = ctx.currentTime;
        g.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
        o.stop(now + 0.55);
        o.onended = () => ctx.close();
      }catch(e){}
    }

    function rewardDraw(){
      const btn = $("btnDraw");
      if(btn) btn.click();
    }

    function finishPhase(){
      // phase finished
      beep();

      const wasWork = (pomo.phase === "work");
      if(wasWork){
        pomo.doneWork += 1;
        toast("专注完成！");
        if(pomo.autoDraw){
          rewardDraw();
          toast("专注完成：奖励一签");
        }
      }else{
        toast("休息结束，回到专注");
      }

      // next phase
      let next = "work";
      if(wasWork){
        next = (pomo.doneWork % pomo.every === 0) ? "long" : "short";
      }else{
        next = "work";
      }

      pomo.phase = next;
      pomo.remaining = phaseSeconds(next);
      pomo.running = false;
      pomo.endAt = null;
      savePomo(pomo);
      updatePomoUI();
      stopTick();

      if(pomo.autoNext){
        // slight delay to let toast show
        setTimeout(() => startPomo(), 300);
      }
    }

    function skipPhase(){
      // treat as finished now
      pausePomo();
      pomo.remaining = 0;
      finishPhase();
    }

    function applySettingChange(){
      // read inputs
      pomo.work = clampInt(pomoUI.work?.value, 1, 120, pomo.work);
      pomo.short = clampInt(pomoUI.short?.value, 1, 60, pomo.short);
      pomo.long = clampInt(pomoUI.long?.value, 1, 90, pomo.long);
      pomo.every = clampInt(pomoUI.every?.value, 1, 12, pomo.every);

      pomo.autoNext = !!pomoUI.autoNext?.checked;
      pomo.autoDraw = !!pomoUI.autoDraw?.checked;

      // if not running, reset remaining for current phase
      if(!pomo.running){
        pomo.remaining = phaseSeconds(pomo.phase);
      }else{
        // running: keep remaining, but endAt should reflect it
        computeRemaining();
        pomo.endAt = Date.now() + pomo.remaining * 1000;
      }

      savePomo(pomo);
      updatePomoUI();
    }

    function initPomo(){
      // hydrate remaining if running
      if(pomo.running && typeof pomo.endAt === "number"){
        computeRemaining();
        if(pomo.remaining <= 0){
          pomo.running = false;
          pomo.endAt = null;
          savePomo(pomo);
        }
      }

      // init controls
      updatePomoUI();

      pomoUI.start?.addEventListener("click", startPomo);
      pomoUI.pause?.addEventListener("click", pausePomo);
      pomoUI.reset?.addEventListener("click", resetPomo);
      pomoUI.skip?.addEventListener("click", skipPhase);

      for(const el of [pomoUI.work, pomoUI.short, pomoUI.long, pomoUI.every]){
        el?.addEventListener("change", applySettingChange);
      }
      pomoUI.autoNext?.addEventListener("change", applySettingChange);
      pomoUI.autoDraw?.addEventListener("change", applySettingChange);

      // keep ticking if running
      if(pomo.running) startTick();

      document.addEventListener("visibilitychange", () => {
        // refresh UI instantly after returning foreground
        computeRemaining();
        updatePomoUI();
      });
    }

    initPomo();
  </script>
</body>
</html>
