<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="/cycle/icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/cycle/icons/icon-192.png">
<link rel="manifest" href="/cycle/draw/manifest.webmanifest">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日月抽签 · 自定义签筒</title>
  <meta name="theme-color" content="#A3B18A" />
  <style>
    :root{
      --bg:#E8E4DE;
      --card:#F5F2EE;
      --ink:#2E2E2E;
      --muted:#6E6A63;
      --line:#D7D1C9;
      --a:#A3B18A;   /* 雾绿 */
      --b:#9AA6B2;   /* 雾蓝灰 */
      --shadow:0 10px 28px rgba(0,0,0,.08);
      --r:22px;
    }
*{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC","Noto Sans SC", Arial, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(900px 600px at 10% 0%, color-mix(in srgb, var(--a) 22%, transparent), transparent 60%),
        radial-gradient(900px 600px at 90% 10%, color-mix(in srgb, var(--b) 18%, transparent), transparent 60%),
        var(--bg);
      min-height:100vh;
      padding:16px 12px 40px;
    }
    .wrap{max-width:820px;margin:0 auto}
    .top{
      display:flex;gap:10px;align-items:center;
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:var(--r);
      background:rgba(245,242,238,.78);
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
    }
    .badge{
      width:34px;height:34px;border-radius:12px;
      background: conic-gradient(from 210deg, var(--a), var(--b), #CBBFAF, var(--a));
      display:grid;place-items:center;
      color:#fff;font-weight:800;user-select:none;
    }
    h1{margin:0;font-size:16px}
    .sub{margin-top:2px;font-size:12px;color:var(--muted);line-height:1.4}
    .tag{
      margin-left:auto;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.55);
      padding:6px 10px;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }

    .grid{
      margin-top:12px;
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }
    .card{
      border:1px solid var(--line);
      border-radius:var(--r);
      background:rgba(245,242,238,.78);
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
      padding:14px;
    }

    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    button{
      appearance:none;
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      padding:10px 12px;
      font-weight:760;
      color:var(--ink);
      box-shadow:0 10px 18px rgba(0,0,0,.06);
      cursor:pointer;
    }
    button:active{transform:translateY(1px)}
    .primary{
      background: linear-gradient(135deg, color-mix(in srgb, var(--a) 35%, white), color-mix(in srgb, var(--b) 20%, white));
      border-color: color-mix(in srgb, var(--a) 55%, var(--line));
    }
    .ghost{background:transparent;box-shadow:none}
    .pill{
      border:1px solid var(--line);
      background:rgba(255,255,255,.55);
      border-radius:999px;
      padding:8px 10px;
      font-size:12px;
      color:var(--muted);
      user-select:none;
    }

    .result{
      margin-top:10px;
      border-radius:18px;
      border:1px dashed color-mix(in srgb, var(--b) 55%, transparent);
      background:rgba(255,255,255,.55);
      padding:12px;
      min-height:72px;
    }
    .big{font-size:18px;font-weight:850;letter-spacing:.2px;word-break:break-word}
    .small{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.5}

    input, textarea{
      width:100%;
      border:1px solid var(--line);
      background:rgba(255,255,255,.7);
      border-radius:16px;
      padding:10px 12px;
      font-size:14px;
      color:var(--ink);
      outline:none;
    }
    textarea{min-height:140px;resize:vertical}
    .hint{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.5}

    @media (min-width:780px){
      body{padding:24px 18px 50px}
      .grid{grid-template-columns:1.05fr .95fr}
      .big{font-size:22px}
      .result{min-height:140px}
    }
    /* 隐藏自定义签筒区域（先不删，省得出事） */

  
  .history{
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed rgba(40,20,80,.12);
    font-size: 12px;
    color: var(--muted);
  }
  .history:empty{ display:none; }
  .history .hrow{
    display:flex;
    gap:10px;
    align-items:baseline;
    justify-content:space-between;
    margin-top: 6px;
  }
  .history .t{ opacity:.85; font-variant-numeric: tabular-nums; }
  .history .v{ flex:1; text-align:right; color: var(--ink); }


  .toast{
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    border: 1px solid rgba(40,20,80,.12);
    box-shadow: 0 10px 30px rgba(40,20,80,.12);
    color: var(--ink);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(-2px);
  }

</style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="badge">☾</div>
      <div>
        <h1>日月抽签机</h1>
        <div class="sub">你可以自定义签筒。每行一条签，本地保存，不联网。</div>
      </div>
      <div class="tag" id="bagName">默认签筒</div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="row">
          <button class="primary" id="btnDraw">抽一签</button>
          <button class="ghost" id="btnCopy">复制结果</button>
          
          <button class="ghost" id="btnClearLast">清空展示</button>
          <button class="ghost" id="btnMode" title="切换：随机 / 不重复">模式：随机</button>
          <span class="pill" id="stat">签数：0</span>
        </div>

        <div class="result">
          <div class="big" id="resultText">点“抽一签”</div>
          <div class="history" id="history"></div>
<div class="small" id="resultMeta">抽到就算数。反悔也行，但要对自己好一点。</div>
        </div>

        <div class="hint">
          小提示：签写成行动句更好玩，比如“喝水”“伸懒腰”“看窗外两分钟”“把手机放下”。🙂
        </div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div style="font-weight:850">自定义签筒</div>
          <button class="ghost" id="btnReset">恢复默认签</button>
        </div>

        <div class="hint" style="margin-top:10px">签筒名字（可选）</div>
        <input id="bagTitle" placeholder="比如：小鹿的日月签" />

        <div class="hint" style="margin-top:10px">每行一条签（空行会自动忽略）</div>
        <textarea id="bagInput" spellcheck="false" placeholder="例如：
喝水
伸懒腰
看窗外两分钟
收拾桌面1分钟
早点睡"></textarea>

        <div class="row" style="margin-top:10px">
          <button class="primary" id="btnSave">保存签筒</button>
          <span class="pill" id="saveTip">保存后下次打开还在</span>
        </div>
      </div>
    </div>
  </div>

  <script>
  const $ = (id) => document.getElementById(id);
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };

  const safeParse = (raw, fallback) => {
    try { return JSON.parse(raw); } catch { return fallback; }
  };

  const escapeHTML = (s) => String(s).replace(/[&<>"']/g, (c) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));

  const shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  const hashStr = (s) => {
    // djb2
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
    return (h >>> 0).toString(16);
  };

  // storage keys (keep existing bag/name/last keys)
  const LS_BAG = "sunmoon_draw_bag_v1";
  const LS_NAME = "sunmoon_draw_name_v1";
  const LS_LAST = "sunmoon_draw_last_v1";
  const LS_MODE = "sunmoon_draw_mode_v1";      // "random" | "norepeat"
  const LS_QUEUE = "sunmoon_draw_queue_v1";    // { hash, items: [] }
  const LS_HISTORY = "sunmoon_draw_hist_v1";   // [{text, at}]

  const defaultName = "日月签筒";
  const defaultBag = [
    "喝水",
    "伸懒腰",
    "看窗外两分钟",
    "把手机放下 30 秒",
    "收拾桌面 1 分钟",
    "深呼吸 5 次",
    "夸自己一句",
    "去走两步",
    "早一点睡"
  ];

  const getName = () => (localStorage.getItem(LS_NAME) || defaultName).trim() || defaultName;

  const normalizeLines = (text) => {
    return String(text || "")
      .split(/?
/)
      .map(s => s.trim())
      .filter(Boolean);
  };

  const getBag = () => {
    const raw = localStorage.getItem(LS_BAG);
    const lines = normalizeLines(raw || "");
    return lines.length ? lines : defaultBag.slice();
  };

  const setBag = (lines, name) => {
    localStorage.setItem(LS_BAG, lines.join("
"));
    localStorage.setItem(LS_NAME, (name || "").trim());
    // bag changed → reset queue (if in norepeat)
    rebuildQueue();
    updateUI();
  };

  const setDefaultBag = () => {
    localStorage.setItem(LS_BAG, defaultBag.join("
"));
    localStorage.setItem(LS_NAME, defaultName);
    rebuildQueue(true);
    updateUI();
  };

  const getMode = () => localStorage.getItem(LS_MODE) || "random";
  const setMode = (mode) => {
    localStorage.setItem(LS_MODE, mode);
    rebuildQueue(true);
    updateUI();
  };

  const toggleMode = () => setMode(getMode() === "norepeat" ? "random" : "norepeat");

  const getQueueObj = () => safeParse(localStorage.getItem(LS_QUEUE), null);

  const rebuildQueue = (force = false) => {
    if (getMode() !== "norepeat") {
      localStorage.removeItem(LS_QUEUE);
      return;
    }
    const bag = getBag();
    const h = hashStr(bag.join("
"));
    const q = getQueueObj();
    if (force || !q || q.hash !== h || !Array.isArray(q.items)) {
      localStorage.setItem(LS_QUEUE, JSON.stringify({ hash: h, items: shuffle(bag.slice()) }));
    }
  };

  const pullOneFromQueue = () => {
    rebuildQueue(false);
    const bag = getBag();
    const h = hashStr(bag.join("
"));
    let q = getQueueObj();
    if (!q || q.hash !== h || !Array.isArray(q.items)) {
      q = { hash: h, items: shuffle(bag.slice()) };
    }
    if (!q.items.length) {
      // new cycle
      q.items = shuffle(bag.slice());
    }
    const pick = q.items.shift();
    localStorage.setItem(LS_QUEUE, JSON.stringify(q));
    return { pick, remain: q.items.length, total: bag.length };
  };

  const saveLast = (text) => {
    localStorage.setItem(LS_LAST, JSON.stringify({ text, at: Date.now() }));
  };

  const loadLast = () => safeParse(localStorage.getItem(LS_LAST), null);

  const addHistory = (text) => {
    const hist = safeParse(localStorage.getItem(LS_HISTORY), []);
    hist.unshift({ text, at: Date.now() });
    hist.length = Math.min(hist.length, 6);
    localStorage.setItem(LS_HISTORY, JSON.stringify(hist));
  };

  const loadHistory = () => safeParse(localStorage.getItem(LS_HISTORY), []);

  const fmtTime = (ts) => {
    try {
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    } catch {
      return "";
    }
  };

  const updateStat = () => {
    const stat = $("stat");
    if (!stat) return;

    const bag = getBag();
    if (getMode() !== "norepeat") {
      stat.textContent = `签数：${bag.length}`;
      return;
    }

    const q = getQueueObj();
    const h = hashStr(bag.join("
"));
    const remain = (q && q.hash === h && Array.isArray(q.items)) ? q.items.length : bag.length;
    stat.textContent = `剩余：${remain}/${bag.length}`;
  };

  const renderHistory = () => {
    const el = $("history");
    if (!el) return;
    const hist = loadHistory();
    if (!hist.length) { el.innerHTML = ""; return; }

    const rows = hist.slice(0, 5).map(item => {
      const t = fmtTime(item.at);
      return `<div class="hrow"><span class="t">${escapeHTML(t)}</span><span class="v">${escapeHTML(item.text)}</span></div>`;
    });
    el.innerHTML = rows.join("");
  };

  const updateModeUI = () => {
    const btn = $("btnMode");
    if (!btn) return;
    btn.textContent = (getMode() === "norepeat") ? "模式：不重复" : "模式：随机";
  };

  const updateUI = () => {
    // header name
    const bagName = $("bagName");
    if (bagName) bagName.textContent = getName();

    // editor fields
    const bagTitle = $("bagTitle");
    const bagInput = $("bagInput");
    if (bagTitle) bagTitle.value = getName();
    if (bagInput) bagInput.value = getBag().join("
");

    // mode/stat/history
    updateModeUI();
    updateStat();
    renderHistory();

    // last result
    const last = loadLast();
    if (last && last.text) {
      const rt = $("resultText");
      const rm = $("resultMeta");
      if (rt) rt.textContent = last.text;
      if (rm) rm.textContent = `上次：${fmtTime(last.at)}`;
    }
  };

  const drawOne = () => {
    const mode = getMode();
    let pick, remain, total;

    if (mode === "norepeat") {
      const out = pullOneFromQueue();
      pick = out.pick;
      remain = out.remain;
      total = out.total;
    } else {
      const bag = getBag();
      pick = bag[Math.floor(Math.random() * bag.length)];
    }

    const rt = $("resultText");
    const rm = $("resultMeta");
    if (rt) rt.textContent = pick;
    if (rm) rm.textContent = `抽到时间：${fmtTime(Date.now())}`;

    saveLast(pick);
    addHistory(pick);

    updateStat();
    renderHistory();

    // tiny pop animation
    if (rt) {
      rt.animate([{ transform: "translateY(2px)", opacity: 0.6 }, { transform: "translateY(0)", opacity: 1 }], { duration: 160, easing: "ease-out" });
    }
  };

  const copyResult = async () => {
    const rt = $("resultText");
    if (!rt) return;
    const text = rt.textContent.trim();
    if (!text) return;

    try {
      await navigator.clipboard.writeText(text);
      toast("已复制到剪贴板");
    } catch {
      // fallback
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); toast("已复制到剪贴板"); } catch { toast("复制失败，可手动选中复制"); }
      ta.remove();
    }
  };

  const clearResult = () => {
    const rt = $("resultText");
    const rm = $("resultMeta");
    if (rt) rt.textContent = "点“抽一签”";
    if (rm) rm.textContent = "";
    toast("已清空展示");
  };

  const toast = (msg) => {
    const t = $("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => t.classList.remove("show"), 1500);
  };

  const saveFromEditor = () => {
    const bagTitle = $("bagTitle");
    const bagInput = $("bagInput");
    const name = bagTitle ? bagTitle.value : "";
    const lines = normalizeLines(bagInput ? bagInput.value : "");
    if (!lines.length) {
      toast("签筒不能为空（至少一行）");
      return;
    }
    setBag(lines, name);
    toast("已保存签筒");
    const tip = $("saveTip");
    if (tip) tip.style.display = "inline-block";
    setTimeout(() => { if (tip) tip.style.display = "none"; }, 1400);
  };

  // bind events
  on("btnDraw", "click", drawOne);
  on("btnCopy", "click", copyResult);
  on("btnClearLast", "click", clearResult);
  on("btnSave", "click", saveFromEditor);
  on("btnReset", "click", () => { setDefaultBag(); toast("已恢复默认签"); });
  on("btnMode", "click", () => { toggleMode(); toast(getMode() === "norepeat" ? "已切换：不重复" : "已切换：随机"); });

  // init
  updateUI();
</script>
  <div class="toast" id="toast" aria-live="polite"></div>
</body>
</html>
