<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>SunMoon · Home</title>
  <meta name="theme-color" content="#A3B18A" />

  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest?v=20260216" />

  <style>
    :root{
      --bg:#E8E4DE; --card:#F5F2EE; --ink:#2E2E2E; --muted:#6E6A63; --line:#D7D1C9;
      --a:#A3B18A; --r:22px; --shadow:0 10px 28px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",Arial,sans-serif}
    .wrap{max-width:820px;margin:0 auto;padding:18px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
    .title{display:flex;gap:12px;align-items:center}
    .logo{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;border:1px solid var(--line)}
    .h1{font-weight:800;font-size:18px}
    .sub{color:var(--muted);font-size:13px;margin-top:2px}
    .grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}

    a.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:14px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);
      text-decoration:none;color:var(--ink);font-weight:700}
    a.btn .tag{color:var(--muted);font-weight:600}
    a.btn:active{transform:translateY(1px)}

    @media (min-width:700px){
      .grid{grid-template-columns:1fr 1fr}
      .grid a.btn:last-child{grid-column:1 / -1} /* ✅ 第三个按钮居中横跨两列 */
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="title">
        <div class="logo">🌞🌙</div>
        <div>
          <div class="h1">SunMoon</div>
          <div class="sub">small pages, calm days.</div>
        </div>
      </div>

      <div class="grid">
        <a class="btn" href="./index.html">🌙 潮汐 <span class="tag">周期记录</span></a>
        <a class="btn" href="./draw/index.html">🎴 抽签 <span class="tag">番茄钟联动</span></a>
        <a class="btn" href="./vault/index.html">📚 十四行诗 <span class="tag">句子与日记</span></a>
      </div>
    </div>
  </div>
</body>
</html>
