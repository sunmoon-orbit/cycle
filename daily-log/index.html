<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b8c7bd" />
  <title>小清记录本</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <style>
    :root{--bg:#f7f5f0;--card:#fffdf8;--soft:#f1eee7;--ink:#2f2d35;--muted:#77717c;--sage:#b8c7bd;--sage2:#e5ece7;--oat:#ded3c2;--clay:#c9a99c;--line:rgba(47,45,53,.11);--shadow:rgba(52,45,38,.10);--danger:#a66b61}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f8f6f1,#f1eee7);padding:calc(18px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom))}.app{width:min(820px,100%);margin:0 auto}.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:16px;background:var(--sage);display:grid;place-items:center;box-shadow:0 10px 22px var(--shadow);font-size:25px;border:1px solid rgba(47,45,53,.08)}.title h1{font-size:22px;margin:0 0 2px;font-weight:900}.title p{margin:0;color:var(--muted);font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 14px}.tab{border:1px solid var(--line);background:rgba(255,253,248,.78);border-radius:16px;padding:12px 8px;font-weight:850;color:var(--muted);box-shadow:none}.tab.active{background:var(--sage);color:#24342d;border-color:rgba(47,45,53,.10)}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;border:0}.card{background:rgba(255,253,248,.90);border:1px solid rgba(47,45,53,.08);box-shadow:0 14px 32px var(--shadow);border-radius:24px;padding:16px;margin-bottom:14px}.card h2{font-size:18px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.grid{display:grid;gap:12px}.dose{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:14px}.doseTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}.doseName{font-weight:900}.doseMeta{font-size:12px;color:var(--muted);margin-top:3px}.bigBtn{width:100%;border-radius:18px;padding:16px 14px;background:var(--sage);font-weight:900;color:#26362f;box-shadow:0 10px 18px rgba(75,80,70,.10);font-size:16px;border:1px solid rgba(47,45,53,.08)}.bigBtn.done{background:var(--oat);color:#383027}.subActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.small{border-radius:12px;padding:8px 10px;background:#fffdf8;border:1px solid var(--line);color:var(--muted);font-size:12px}.small.danger{color:var(--danger)}.status{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.55}.status strong{color:var(--ink)}.records{display:grid;gap:8px}.record{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 11px;font-size:13px}.record b{font-weight:900}.empty{border:1px dashed rgba(47,45,53,.18);border-radius:16px;padding:14px;text-align:center;color:var(--muted);font-size:13px;background:var(--soft)}.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.field input,.field select{width:100%;border:1px solid var(--line);background:#fffefb;border-radius:14px;padding:11px 12px;color:var(--ink);outline:none}.field input:focus,.field select:focus,.settingsLine input:focus{border-color:rgba(127,153,140,.55);box-shadow:0 0 0 3px rgba(184,199,189,.25)}.primary{border-radius:16px;padding:12px 14px;background:var(--sage);font-weight:900;color:#24342d;border:1px solid rgba(47,45,53,.08)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sum{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:11px;text-align:center}.sum .n{font-weight:950;font-size:17px;margin-top:4px}.note{font-size:12px;color:var(--muted);line-height:1.6}.settingsLine{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:16px;padding:11px;background:var(--card);margin-bottom:8px}.settingsLine input{border:1px solid var(--line);border-radius:12px;padding:8px 9px;min-width:0;width:150px;background:#fffefb}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(255,253,248,.96);border:1px solid var(--line);box-shadow:0 18px 40px var(--shadow);border-radius:999px;padding:10px 14px;font-size:13px;color:var(--muted);display:none;z-index:30}.hidden{display:none!important}@media(max-width:560px){.row{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.hero{align-items:flex-start}.logo{width:42px;height:42px}.title h1{font-size:20px}.card{border-radius:20px;padding:14px}.tabs{position:sticky;top:8px;z-index:5;background:rgba(247,245,240,.80);backdrop-filter:blur(10px);padding:4px;border-radius:18px}.tab{padding:11px 4px}}
  </style>
</head>
<body>
  <main class="app">
    <section class="hero"><div class="brand"><div class="logo" aria-hidden="true">✦</div><div class="title"><h1>小清记录本</h1><p>只帮你确认：刚刚到底记没记。</p></div></div><button class="small" id="installBtn" hidden>安装</button></section>
    <nav class="tabs" aria-label="页面切换"><button class="tab active" data-tab="meds">吃药</button><button class="tab" data-tab="ledger">记账</button><button class="tab" data-tab="settings">设置</button></nav>
    <section id="meds" class="page"><div class="card"><h2>今日吃药记录</h2><p class="muted">今天是 <strong id="todayLabel"></strong>。跨天后今天状态会自动变空，历史仍保留最近 7 天。</p></div><div class="grid" id="doseGrid"></div><div class="card"><h2>今天的记录</h2><div id="todayRecords" class="records"></div></div><div class="card"><p class="note">数据仅保存在本设备浏览器中，小清如果清除浏览器数据会丢失。</p></div></section>
    <section id="ledger" class="page hidden"><div class="card"><h2>简单记账</h2><div class="summary"><div class="sum"><span class="muted">今日支出</span><div class="n" id="sumOut">¥0</div></div><div class="sum"><span class="muted">今日收入</span><div class="n" id="sumIn">¥0</div></div><div class="sum"><span class="muted">今日净额</span><div class="n" id="sumNet">¥0</div></div></div></div><div class="card"><div class="form"><div class="row"><div class="field"><label>类型</label><select id="moneyType"><option value="expense">支出</option><option value="income">收入</option></select></div><div class="field"><label>金额</label><input id="moneyAmount" inputmode="decimal" placeholder="例如 12.5" /></div></div><div class="row"><div class="field"><label>分类</label><input id="moneyCat" placeholder="吃饭 / 交通 / 游戏" /></div><div class="field"><label>备注</label><input id="moneyNote" placeholder="可选" /></div></div><button class="primary" id="addMoney">记录一笔</button></div></div><div class="card"><h2>最近账目</h2><div id="moneyList" class="records"></div></div></section>
    <section id="settings" class="page hidden"><div class="card"><h2>药物显示名</h2><p class="muted">这里只改页面上的名字，不涉及任何医学判断。</p><div id="settingsList"></div><button class="primary" id="saveSettings">保存设置</button></div><div class="card"><h2>本地数据</h2><p class="note">所有记录只在本设备浏览器里。换设备、清除浏览器数据或换浏览器，都可能看不到原来的数据。</p><button class="small danger" id="clearAll">清空全部本地记录</button></div></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const KEY='xiaoqing.dailyLog.v1';
const defaultState={settings:{medA:'药物 A',medB:'药物 B'},meds:[],money:[]};
const slots=[{id:'a-morning',drug:'medA',label:'早：已吃半颗',meta:'早 / 中 / 晚各半颗'},{id:'a-noon',drug:'medA',label:'中：已吃半颗',meta:'早 / 中 / 晚各半颗'},{id:'a-night',drug:'medA',label:'晚：已吃半颗',meta:'早 / 中 / 晚各半颗'},{id:'b-two',drug:'medB',label:'已吃两粒',meta:'一次两粒'}];
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
const nowIso=()=>new Date().toISOString(), dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, todayKey=()=>dateKey(new Date());
const fmtTime=iso=>{const d=new Date(iso);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtDate=iso=>{const d=new Date(iso);return `${d.getMonth()+1}月${d.getDate()}日 ${fmtTime(iso)}`};
function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(defaultState)}}
function save(){state.meds=state.meds.filter(r=>Date.now()-new Date(r.time).getTime()<8*86400000);localStorage.setItem(KEY,JSON.stringify(state))}
let state=load();
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1600)}
function ago(iso){const s=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/1000));if(s<60)return '刚刚';const m=Math.floor(s/60);if(m<60)return `${m} 分钟前`;const h=Math.floor(m/60),mm=m%60;if(h<24)return `${h} 小时${mm?` ${mm} 分钟`:''}前`;return `${Math.floor(h/24)} 天前`}
function recordsForSlot(slotId){return state.meds.filter(r=>r.slotId===slotId&&r.day===todayKey()).sort((a,b)=>new Date(b.time)-new Date(a.time))}
function renderMeds(){ $('todayLabel').textContent=todayKey(); const grid=$('doseGrid'); grid.innerHTML=''; slots.forEach(slot=>{const recs=recordsForSlot(slot.id), last=recs[0], done=!!last, drugName=state.settings[slot.drug]||slot.drug; const card=document.createElement('div'); card.className='dose'; card.innerHTML=`<div class="doseTop"><div><div class="doseName">${drugName}</div><div class="doseMeta">${slot.meta}</div></div><span class="small">今日 ${recs.length} 次</span></div><button class="bigBtn ${done?'done':''}" data-act="take" data-slot="${slot.id}">${done?'再记一次':'记录现在'} · ${slot.label}</button><div class="status">${last?`<strong>今天 ${fmtTime(last.time)}</strong> 已记录，${ago(last.time)}`:'今天还没有记录。'}</div><div class="subActions"><button class="small danger" data-act="undo" data-slot="${slot.id}" ${last?'':'disabled'}>撤销本项上一条</button></div>`; grid.appendChild(card)}); renderTodayRecords()}
function renderTodayRecords(){const list=$('todayRecords'), recs=state.meds.filter(r=>r.day===todayKey()).sort((a,b)=>new Date(b.time)-new Date(a.time)); if(!recs.length){list.innerHTML='<div class="empty">今天还没有吃药记录。</div>';return} list.innerHTML=recs.map(r=>{const slot=slots.find(s=>s.id===r.slotId), name=state.settings[slot?.drug]||'药物'; return `<div class="record"><span><b>${name}</b> · ${slot?.label||''}</span><span>${fmtTime(r.time)}</span></div>`}).join('')}
function take(slotId){const slot=slots.find(s=>s.id===slotId); state.meds.push({id:crypto.randomUUID(),slotId,drug:slot.drug,label:slot.label,time:nowIso(),day:todayKey()}); save(); renderAll(); toast('已经记录当前时间')}
function undo(slotId){const recs=recordsForSlot(slotId); if(!recs.length)return; state.meds=state.meds.filter(r=>r.id!==recs[0].id); save(); renderAll(); toast('已撤销上一条')}
document.addEventListener('click',e=>{const btn=e.target.closest('button'); if(!btn)return; const tab=btn.dataset.tab; if(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('hidden',p.id!==tab));return} const act=btn.dataset.act; if(act==='take')take(btn.dataset.slot); if(act==='undo')undo(btn.dataset.slot)});
function moneyToday(){return state.money.filter(x=>x.day===todayKey())}
function moneyFmt(n){return `¥${Number(n||0).toFixed(2).replace(/\.00$/,'')}`}
function renderMoney(){const today=moneyToday(), income=today.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0), expense=today.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0); $('sumIn').textContent=moneyFmt(income); $('sumOut').textContent=moneyFmt(expense); $('sumNet').textContent=moneyFmt(income-expense); const list=$('moneyList'), rows=[...state.money].sort((a,b)=>new Date(b.time)-new Date(a.time)).slice(0,20); if(!rows.length){list.innerHTML='<div class="empty">还没有账目。</div>';return} list.innerHTML=rows.map(x=>`<div class="record"><span><b>${x.type==='income'?'收入':'支出'} ${moneyFmt(x.amount)}</b><br><span class="muted">${x.cat||'未分类'} ${x.note?`· ${x.note}`:''}</span></span><span><span class="muted">${fmtDate(x.time)}</span><br><button class="small danger" data-del-money="${x.id}">删除</button></span></div>`).join('')}
$('addMoney').addEventListener('click',()=>{const amount=parseFloat($('moneyAmount').value); if(!Number.isFinite(amount)||amount<=0){toast('先填一个有效金额');return} state.money.push({id:crypto.randomUUID(),type:$('moneyType').value,amount,cat:$('moneyCat').value.trim(),note:$('moneyNote').value.trim(),time:nowIso(),day:todayKey()}); ['moneyAmount','moneyCat','moneyNote'].forEach(id=>$(id).value=''); save(); renderAll(); toast('账目已记录')});
document.addEventListener('click',e=>{const b=e.target.closest('[data-del-money]'); if(!b)return; state.money=state.money.filter(x=>x.id!==b.dataset.delMoney); save(); renderAll(); toast('已删除')});
function renderSettings(){const wrap=$('settingsList'); wrap.innerHTML=`<div class="settingsLine"><span>药物 A</span><input id="setMedA" value="${state.settings.medA||''}"></div><div class="settingsLine"><span>药物 B</span><input id="setMedB" value="${state.settings.medB||''}"></div>`}
$('saveSettings').addEventListener('click',()=>{state.settings.medA=$('setMedA').value.trim()||'药物 A'; state.settings.medB=$('setMedB').value.trim()||'药物 B'; save(); renderAll(); toast('设置已保存')});
$('clearAll').addEventListener('click',()=>{if(confirm('确定清空全部本地记录吗？')){state=structuredClone(defaultState); save(); renderAll(); toast('已清空')}});
function renderAll(){renderMeds(); renderMoney(); renderSettings()} setInterval(renderMeds,60000); renderAll();
let deferredPrompt; window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').hidden=false}); $('installBtn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').hidden=true});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
