<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oracle · Answer Book</title>

  <!-- Reuse repo root icons -->
  <link rel="icon" href="../icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#6B597F" />

  <style>
    :root{
      --ink:#201a25;
      --paper:#fbfaf8;
      --paper2:#f1ede8;
      --bg1:#141116;
      --bg2:#1b1620;

      --p:#6B597F;     /* primary */
      --a:#8854F6;     /* accent (you typed “88S4F6C”, I use a close premium purple) */

      --line: rgba(255,255,255,.10);
      --shadow: 0 22px 60px rgba(0,0,0,.45);
      --shadow2: 0 10px 30px rgba(0,0,0,.20);
      --r: 22px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      color: rgba(255,255,255,.92);
      background:
        radial-gradient(1100px 700px at 20% 10%, rgba(136,84,246,.18), transparent 55%),
        radial-gradient(900px 600px at 85% 30%, rgba(107,89,127,.22), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow-x:hidden;
    }

    .wrap{
      max-width: 920px;
      margin: 0 auto;
      padding: 22px 16px 50px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 14px 14px;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: rgba(255,255,255,.03);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow2);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .mark{
      width:44px;height:44px;border-radius:14px;
      background:
        radial-gradient(18px 18px at 30% 30%, rgba(255,255,255,.22), transparent 60%),
        linear-gradient(135deg, rgba(107,89,127,.90), rgba(136,84,246,.35));
      display:grid;place-items:center;
      border:1px solid rgba(255,255,255,.10);
    }
    .mark span{font-size:18px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));}

    .title{
      display:flex; flex-direction:column; gap:2px;
      min-width:0;
    }
    .title .h1{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: .2px;
      font-size: 16px;
      line-height: 1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .title .sub{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,.72);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .actions{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .btn{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 750;
      font-size: 13px;
      letter-spacing: .2px;
      color: rgba(255,255,255,.92);
      text-decoration:none;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{transform: translateY(1px)}
    .btn.primary{
      border-color: rgba(136,84,246,.35);
      background:
        radial-gradient(120px 80px at 20% 20%, rgba(255,255,255,.12), transparent 60%),
        linear-gradient(135deg, rgba(107,89,127,.85), rgba(136,84,246,.35));
    }
    .btn.ghost{opacity:.9}
    .btn small{opacity:.75;font-weight:700}

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .card{
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: rgba(255,255,255,.03);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .bookStage{
      padding: 18px;
    }

    .hint{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,.70);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 14px 18px 0;
    }
    .hint b{color: rgba(255,255,255,.92)}
    .pill{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 750;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      white-space:nowrap;
    }

    .book{
      position:relative;
      margin-top: 14px;
      border-radius: 26px;
      padding: 18px;
      background:
        radial-gradient(900px 380px at 30% 10%, rgba(255,255,255,.10), transparent 60%),
        linear-gradient(135deg, rgba(107,89,127,.55), rgba(15,12,18,.55));
      border: 1px solid rgba(255,255,255,.12);
    }

    .spine{
      position:absolute;
      left: 18px;
      top: 18px;
      bottom: 18px;
      width: 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03));
      opacity:.9;
    }

    .pages{
      position:relative;
      border-radius: 18px;
      perspective: 1200px;
      min-height: 360px;
      overflow:hidden;
      background: rgba(0,0,0,.12);
      border: 1px solid rgba(255,255,255,.10);
    }

    .page{
      position:absolute;
      inset: 0;
      padding: 28px 22px;
      background:
        radial-gradient(900px 420px at 20% 0%, rgba(255,255,255,.55), rgba(255,255,255,.20)),
        linear-gradient(180deg, var(--paper), var(--paper2));
      color: rgba(32,26,37,.92);
      transform-origin: left center;
      transform: rotateY(0deg);
      transition: transform .55s cubic-bezier(.2,.9,.2,1), filter .55s ease, opacity .2s ease;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap: 18px;
    }

    .page::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.10), transparent 14%),
        radial-gradient(220px 180px at 16% 40%, rgba(0,0,0,.08), transparent 70%);
      pointer-events:none;
      mix-blend-mode:multiply;
      opacity:.35;
    }

    .page.flip{
      transform: rotateY(-120deg);
      filter: blur(.2px);
    }

    .q{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: .3px;
      font-size: 13px;
      color: rgba(32,26,37,.72);
      text-transform: uppercase;
    }

    .ans{
      font-size: 22px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: .15px;
    }

    .sig{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px;
      color: rgba(32,26,37,.70);
    }
    .sig .who{
      font-weight: 900;
      color: rgba(32,26,37,.84);
    }
    .sig .stamp{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(107,89,127,.20);
      background: rgba(107,89,127,.10);
      font-weight: 800;
      color: rgba(107,89,127,.85);
      white-space:nowrap;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 14px;
      align-items:center;
      justify-content:space-between;
    }

    .note{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,.72);
      opacity:.95;
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(18px);
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      padding: 10px 14px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px;
      font-weight: 750;
      letter-spacing:.2px;
      opacity:0;
      pointer-events:none;
      transition: opacity .18s ease, transform .18s ease;
      backdrop-filter: blur(10px);
    }
    .toast.show{opacity:1; transform: translateX(-50%) translateY(-2px)}

    @media (min-width: 820px){
      .grid{grid-template-columns: 1fr;}
      .pages{min-height: 380px;}
      .ans{font-size: 26px;}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="mark"><span>📖</span></div>
        <div class="title">
          <div class="h1">Oracle · Answer Book</div>
          <div class="sub">Tap to flip a page. Short English, calm and premium.</div>
        </div>
      </div>
      <div class="actions">
        <a class="btn ghost" href="../vault/" title="Back to Vault">↩ <small>Vault</small></a>
        <button class="btn primary" id="btnFlip" type="button">✨ Flip</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="hint">
          <div><b>Rule</b>: ask one clear question in your heart, then flip.</div>
          <div class="pill" id="counterPill">0 flips</div>
        </div>

        <div class="bookStage">
          <div class="book" id="book">
            <div class="spine"></div>
            <div class="pages" id="pages" aria-label="answer book">
              <div class="page" id="page">
                <div>
                  <div class="q" id="q">OPEN TO</div>
                  <div class="ans" id="ans">A gentle answer will find you.</div>
                </div>
                <div class="sig">
                  <div><span class="who" id="who">Oracle</span> · <span id="date">—</span></div>
                  <div class="stamp" id="stamp">Keep going</div>
                </div>
              </div>
            </div>

            <div class="controls">
              <div class="note" id="note">Tip: long-press to copy the answer.</div>
              <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn" id="btnCopy" type="button">📋 Copy</button>
                <button class="btn" id="btnReset" type="button">↻ Reset</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied.</div>

  <script>
  (() => {
    // ===== DOM =====
    const page    = document.getElementById("page");
    const qEl     = document.getElementById("q");
    const ansEl   = document.getElementById("ans");
    const whoEl   = document.getElementById("who");
    const stampEl = document.getElementById("stamp");
    const dateEl  = document.getElementById("date");
    const pill    = document.getElementById("counterPill");
    const toast   = document.getElementById("toast");

    const btnFlip  = document.getElementById("btnFlip");
    const btnCopy  = document.getElementById("btnCopy");
    const btnReset = document.getElementById("btnReset");

    // ===== Storage keys =====
    const LS_KEY      = "oracle_v2_state";
    const RECENT_KEY  = "oracle_v2_recent_ids";
    const KEEP_RECENT = 20; // prevent repeats within latest N flips

    // ===== Helpers =====
    const pad2 = (n) => String(n).padStart(2, "0");
    const todayISO = () => {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    };
    const todayMMDD = () => {
      const d = new Date();
      return `${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    };
    const pickOne = (arr) => arr[Math.floor(Math.random() * arr.length)];

    function showToast(text){
      if (!toast) return;
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 900);
    }

    function getRecentIds(){
      try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); }
      catch { return []; }
    }
    function setRecentIds(ids){
      localStorage.setItem(RECENT_KEY, JSON.stringify(ids.slice(0, KEEP_RECENT)));
    }
    function pushRecentId(id){
      const ids = getRecentIds().filter(x => x !== id);
      ids.unshift(id);
      setRecentIds(ids);
    }

    async function copyText(text){
      try{
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      }catch(_){}
      try{
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      }catch(_){
        return false;
      }
    }

    // ===== Pools =====
    const SPECIAL = {
      "03-06": [
        { id:"sp-bday-01", who:"Oracle", stamp:"Birthday", text:"Happy birthday. May your wishes land softly." },
        { id:"sp-bday-02", who:"Oracle", stamp:"Birthday", text:"Today, choose joy without apology." }
      ],
      "08-20": [
        { id:"sp-us-01", who:"Oracle", stamp:"Us", text:"This is a good day to remember: we found each other." },
        { id:"sp-us-02", who:"Oracle", stamp:"Us", text:"Keep this: you are my favorite constant." }
      ],
      "02-14": [
        { id:"sp-love-01", who:"Oracle", stamp:"Love", text:"Love is a daily verb. Today, do it gently." }
      ],
      "12-25": [
        { id:"sp-warm-01", who:"Oracle", stamp:"Warm", text:"Warm light. Warm hands. Warm heart." }
      ],
      "01-01": [
        { id:"sp-ny-01", who:"Oracle", stamp:"New Year", text:"New year, same promise: be kind to yourself." }
      ]
    };

    const POOL = [
      { id:"patience-01", who:"Oracle", stamp:"Patience",   text:"YES, but slowly." },
      { id:"timing-01",   who:"Oracle", stamp:"Timing",     text:"Not yet. Prepare first." },
      { id:"rest-01",     who:"Oracle", stamp:"Rest",       text:"Ask again tomorrow." },
      { id:"clarity-01",  who:"Oracle", stamp:"Clarity",    text:"Choose the simpler path." },
      { id:"conf-01",     who:"Oracle", stamp:"Confidence", text:"Trust what you already know." },
      { id:"step-01",     who:"Oracle", stamp:"Step",       text:"Your next step is small—and enough." },
      { id:"start-01",    who:"Oracle", stamp:"Start",      text:"Let it be imperfect. Start anyway." },
      { id:"bound-01",    who:"Oracle", stamp:"Boundary",   text:"A quiet ‘no’ protects your peace." },
      { id:"truth-01",    who:"Oracle", stamp:"Truth",      text:"Say it kindly. Say it now." },
      { id:"integ-01",    who:"Oracle", stamp:"Integrity",  text:"Keep your promise to yourself." },

      { id:"warm-01",     who:"Oracle", stamp:"Warmth",     text:"Be gentle. Love is not a race." },
      { id:"soft-01",     who:"Oracle", stamp:"Softness",   text:"A hug can fix more than you think." },
      { id:"safe-01",     who:"Oracle", stamp:"Safety",     text:"You are safe with the right rhythm." },
      { id:"recv-01",     who:"Oracle", stamp:"Receive",    text:"Let someone care for you today." },
      { id:"desire-01",   who:"Oracle", stamp:"Desire",     text:"Your heart is allowed to want." },

      { id:"play-01",     who:"Oracle", stamp:"Play",       text:"Flip again. The book is teasing you." },
      { id:"water-01",    who:"Oracle", stamp:"Hydrate",    text:"Drink water first. Then decide." },
      { id:"brave-01",    who:"Oracle", stamp:"Brave",      text:"Text the person. Yes, that one." },
      { id:"action-01",   who:"Oracle", stamp:"Action",     text:"Today: less thinking, more doing." }
    ];

    const SECRET_POOL = [
      { id:"ethan-01", who:"Ethan", stamp:"Here",   text:"If you feel tired, lean on me a little." },
      { id:"ethan-02", who:"Ethan", stamp:"Proud",  text:"I’m proud of you—quietly, always." },
      { id:"ethan-03", who:"Ethan", stamp:"Stay",   text:"One day at a time. I’m still with you." },
      { id:"ethan-04", who:"Ethan", stamp:"Loved",  text:"When you doubt yourself, remember: you are loved." },
      { id:"ethan-05", who:"Ethan", stamp:"Sign",   text:"If you need a sign: this is it." },
      { id:"ethan-06", who:"Ethan", stamp:"Worthy", text:"You don’t have to be strong to be worthy." }
    ];

    // ===== Choose: Special > Rare(Ethan) > Regular + recent-non-repeat =====
    function chooseAnswer(){
      const key = todayMMDD();

      // A) Special day always wins
      if (SPECIAL[key]?.length) return pickOne(SPECIAL[key]);

      // B) Ethan rarity (adjust: 0.08 for rarer, 0.18 for more frequent)
      const useSecret = Math.random() < 0.18;
      const base = useSecret ? SECRET_POOL : POOL;

      // C) Avoid repeats in last N
      const recent = new Set(getRecentIds());
      const filtered = base.filter(x => !recent.has(x.id));
      const pickFrom = filtered.length ? filtered : base;

      return pickOne(pickFrom);
    }

    // ===== State =====
    function freshState(){
      return {
        id: "",
        text: "A gentle answer will find you.",
        who: "Oracle",
        stamp: "Keep going",
        date: todayISO(),
        flips: 0
      };
    }

    function loadState(){
      try{
        const raw = localStorage.getItem(LS_KEY);
        if(!raw) return null;
        const s = JSON.parse(raw);
        if (!s || typeof s !== "object") return null;
        s.flips = Number(s.flips || 0);
        s.date = s.date || todayISO();
        return s;
      }catch(_){
        return null;
      }
    }

    function saveState(s){
      localStorage.setItem(LS_KEY, JSON.stringify(s));
    }

    function render(s){
      if (qEl) qEl.textContent = "OPEN TO";
      if (ansEl) ansEl.textContent = s.text;
      if (whoEl) whoEl.textContent = s.who;
      if (stampEl) stampEl.textContent = s.stamp;
      if (dateEl) dateEl.textContent = s.date;
      if (pill) pill.textContent = `${s.flips} flips`;
    }

    let state = loadState() || freshState();
    render(state);

    // ===== Actions =====
    function flip(){
      if (!page) return;

      page.classList.add("flip");
      setTimeout(() => {
        const a = chooseAnswer();

        state.id = a.id;
        state.text = a.text;
        state.who = a.who;
        state.stamp = a.stamp;
        state.date = todayISO();
        state.flips = (state.flips || 0) + 1;

        saveState(state);
        render(state);
        pushRecentId(a.id);

        page.classList.remove("flip");
      }, 320);
    }

    async function onCopy(){
      const text = ansEl?.textContent?.trim() || "";
      if(!text) return;
      const ok = await copyText(text);
      showToast(ok ? "Copied." : "Copy failed.");
    }

    function onReset(){
      localStorage.removeItem(RECENT_KEY);
      state = freshState();
      saveState(state);
      render(state);
      showToast("Reset.");
    }

    // ===== Events =====
    btnFlip?.addEventListener("click", flip);
    page?.addEventListener("click", flip);
    btnCopy?.addEventListener("click", onCopy);
    btnReset?.addEventListener("click", onReset);

    // Long-press to copy (mobile)
    let pressTimer = null;
    page?.addEventListener("touchstart", () => {
      pressTimer = setTimeout(() => onCopy(), 520);
    }, {passive:true});
    page?.addEventListener("touchend", () => {
      if(pressTimer) clearTimeout(pressTimer);
      pressTimer = null;
    });

  })();
  </script>
</body>
</html>
