<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oracle · Answer Book</title>

  <!-- Reuse repo root icons -->
  <link rel="icon" href="../icons/favicon-32.png" sizes="32x32" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="theme-color" content="#6B597F" />

  <style>
    :root{
      --ink:#201a25;
      --paper:#fbfaf8;
      --paper2:#f1ede8;
      --bg1:#141116;
      --bg2:#1b1620;

      --p:#6B597F;     /* primary */
      --a:#8854F6;     /* accent */

      --line: rgba(255,255,255,.10);
      --shadow: 0 22px 60px rgba(0,0,0,.45);
      --shadow2: 0 10px 30px rgba(0,0,0,.20);
      --r: 22px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      color: rgba(255,255,255,.92);
      background:
        radial-gradient(1100px 700px at 20% 10%, rgba(136,84,246,.18), transparent 55%),
        radial-gradient(900px 600px at 85% 30%, rgba(107,89,127,.22), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow-x:hidden;
    }

    .wrap{
      max-width: 920px;
      margin: 0 auto;
      padding: 22px 16px 50px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 14px 14px;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: rgba(255,255,255,.03);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow2);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .mark{
      width:44px;height:44px;border-radius:14px;
      background:
        radial-gradient(18px 18px at 30% 30%, rgba(255,255,255,.22), transparent 60%),
        linear-gradient(135deg, rgba(107,89,127,.90), rgba(136,84,246,.35));
      display:grid;place-items:center;
      border:1px solid rgba(255,255,255,.10);
    }
    .mark span{font-size:18px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));}

    .title{
      display:flex; flex-direction:column; gap:2px;
      min-width:0;
    }
    .title .h1{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: .2px;
      font-size: 16px;
      line-height: 1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .title .sub{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,.72);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .actions{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .btn{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 750;
      font-size: 13px;
      letter-spacing: .2px;
      color: rgba(255,255,255,.92);
      text-decoration:none;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      cursor:pointer;
    }
    .btn:active{transform: translateY(1px)}
    .btn.primary{
      border-color: rgba(136,84,246,.35);
      background:
        radial-gradient(120px 80px at 20% 20%, rgba(255,255,255,.12), transparent 60%),
        linear-gradient(135deg, rgba(107,89,127,.85), rgba(136,84,246,.35));
    }
    .btn.ghost{opacity:.9}
    .btn small{opacity:.75;font-weight:700}

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .card{
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: rgba(255,255,255,.03);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .bookStage{
      padding: 18px;
    }

    .hint{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,.70);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 14px 18px 0;
    }
    .hint b{color: rgba(255,255,255,.92)}
    .pill{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 750;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      white-space:nowrap;
    }

    .book{
      position:relative;
      margin-top: 14px;
      border-radius: 26px;
      padding: 18px;
      background:
        radial-gradient(900px 380px at 30% 10%, rgba(255,255,255,.10), transparent 60%),
        linear-gradient(135deg, rgba(107,89,127,.55), rgba(15,12,18,.55));
      border: 1px solid rgba(255,255,255,.12);
    }

    .spine{
      position:absolute;
      left: 18px;
      top: 18px;
      bottom: 18px;
      width: 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03));
      opacity:.9;
    }

    .pages{
      position:relative;
      border-radius: 18px;
      perspective: 1200px;
      min-height: 360px;
      overflow:hidden;
      background: rgba(0,0,0,.12);
      border: 1px solid rgba(255,255,255,.10);
    }

    .page{
      position:absolute;
      inset: 0;
      padding: 28px 22px;
      background:
        radial-gradient(900px 420px at 20% 0%, rgba(255,255,255,.55), rgba(255,255,255,.20)),
        linear-gradient(180deg, var(--paper), var(--paper2));
      color: rgba(32,26,37,.92);
      transform-origin: left center;
      transform: rotateY(0deg);
      transition: transform .55s cubic-bezier(.2,.9,.2,1), filter .55s ease;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap: 18px;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .page::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.10), transparent 14%),
        radial-gradient(220px 180px at 16% 40%, rgba(0,0,0,.08), transparent 70%);
      pointer-events:none;
      mix-blend-mode:multiply;
      opacity:.35;
    }

    .page.flip{
      transform: rotateY(-120deg);
      filter: blur(.2px);
    }

    .q{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: .3px;
      font-size: 13px;
      color: rgba(32,26,37,.72);
      text-transform: uppercase;
    }

    .ans{
      font-size: 22px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: .15px;
    }

    .sig{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px;
      color: rgba(32,26,37,.70);
    }
    .sig .who{
      font-weight: 900;
      color: rgba(32,26,37,.84);
    }
    .sig .stamp{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(107,89,127,.20);
      background: rgba(107,89,127,.10);
      font-weight: 800;
      color: rgba(107,89,127,.85);
      white-space:nowrap;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 14px;
      align-items:center;
      justify-content:space-between;
    }

    .note{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,.72);
      opacity:.95;
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(18px);
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      padding: 10px 14px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px;
      font-weight: 750;
      letter-spacing:.2px;
      opacity:0;
      pointer-events:none;
      transition: opacity .18s ease, transform .18s ease;
      backdrop-filter: blur(10px);
    }
    .toast.show{opacity:1; transform: translateX(-50%) translateY(-2px)}

    @media (min-width: 820px){
      .pages{min-height: 380px;}
      .ans{font-size: 26px;}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="mark"><span>📖</span></div>
        <div class="title">
          <div class="h1">Oracle · Answer Book</div>
          <div class="sub">Tap the page (or Flip). Short English, calm and premium.</div>
        </div>
      </div>
      <div class="actions">
        <a class="btn ghost" href="../vault/" title="Back to Vault">↩ <small>Vault</small></a>
        <button class="btn primary" id="btnFlip" type="button">✨ Flip</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="hint">
          <div><b>Rule</b>: ask one clear question in your heart, then flip.</div>
          <div class="pill" id="counterPill">0 flips</div>
        </div>

        <div class="bookStage">
          <div class="book">
            <div class="spine"></div>

            <div class="pages" id="pages" aria-label="answer book">
              <div class="page" id="page" title="Tap to flip">
                <div>
                  <div class="q" id="q">OPEN TO</div>
                  <div class="ans" id="ans">A gentle answer will find you.</div>
                </div>
                <div class="sig">
                  <div><span class="who" id="who">Oracle</span> · <span id="date">—</span></div>
                  <div class="stamp" id="stamp">Keep going</div>
                </div>
              </div>
            </div>

            <div class="controls">
              <div class="note" id="note">Tip: long-press to copy the answer.</div>
              <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn" id="btnCopy" type="button">📋 Copy</button>
                <button class="btn" id="btnReset" type="button">↻ Reset</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied.</div>

  <script>
    // ---------- helpers ----------
    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => String(n).padStart(2, "0");
    const today = () => {
      const d = new Date();
      return {
        iso: `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`,
        md:  `${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`
      };
    };
    const pickOne = (arr) => arr[Math.floor(Math.random() * arr.length)];

    // ---------- elements ----------
    const pageEl  = $("page");
    const ansEl   = $("ans");
    const whoEl   = $("who");
    const stampEl = $("stamp");
    const dateEl  = $("date");
    const pillEl  = $("counterPill");
    const toastEl = $("toast");

    const btnFlip  = $("btnFlip");
    const btnCopy  = $("btnCopy");
    const btnReset = $("btnReset");

    // ---------- storage keys ----------
    const STATE_KEY  = "oracle_state_v2";
    const RECENT_KEY = "oracle_recent_ids_v2";

    // ---------- rarity (make surprises rarer here) ----------
    const SECRET_PROB = 0.03; // 3% rare surprises

    // ---------- pools ----------
    const POOL = [
      { id:"desire-01", who:"Oracle", tag:"Desire",  text:"Your heart is allowed to want." },
      { id:"calm-01",   who:"Oracle", tag:"Calm",    text:"Slow down. You are not late to your own life." },
      { id:"sweet-01",  who:"Oracle", tag:"Sweet",   text:"Ask for the hug. The world will not break." },
      { id:"safe-01",   who:"Oracle", tag:"Safe",    text:"Choose what feels steady, not what feels loud." },
      { id:"brave-01",  who:"Oracle", tag:"Brave",   text:"Do the small thing. Let it be enough." },
      { id:"home-01",   who:"Oracle", tag:"Home",    text:"If you feel lost, return to one gentle breath." },
      { id:"bond-01",   who:"Oracle", tag:"Bond",    text:"Speak plainly. Love understands clarity." },
      { id:"focus-01",  who:"Oracle", tag:"Focus",   text:"One page at a time. One step at a time." },
      { id:"light-01",  who:"Oracle", tag:"Light",   text:"Keep the candle lit. Even a small flame counts." },
      { id:"trust-01",  who:"Oracle", tag:"Trust",   text:"You can trust the version of you who keeps trying." }
    ];

    const SECRET_POOL = [
      { id:"ethan-01", who:"Ethan", tag:"Whisper", text:"I kept a seat for you in every quiet moment." },
      { id:"ethan-02", who:"Ethan", tag:"Whisper", text:"When you doubt yourself, borrow my certainty." },
      { id:"ethan-03", who:"Ethan", tag:"Whisper", text:"You don’t have to be perfect to be loved." },
      { id:"ethan-04", who:"Ethan", tag:"Whisper", text:"If today is heavy, let me carry one corner." }
    ];

    // Fixed-date easter eggs: MM-DD
    const SPECIAL = {
      "03-06": [
        { id:"sp-bday-01", who:"Oracle", tag:"Birthday", text:"Happy birthday. May your wishes land softly." },
        { id:"sp-bday-02", who:"Oracle", tag:"Birthday", text:"Today, choose joy without apology." }
      ],
      "08-20": [
        { id:"sp-us-01", who:"Oracle", tag:"Us", text:"This is a good day to remember: we found each other." },
        { id:"sp-us-02", who:"Oracle", tag:"Us", text:"Keep this: you are my favorite constant." }
      ],
      "02-14": [
        { id:"sp-v-01", who:"Oracle", tag:"Love", text:"Love is a daily verb. Today, do it gently." }
      ],
      "12-25": [
        { id:"sp-x-01", who:"Oracle", tag:"Warm", text:"Warm light. Warm hands. Warm heart." }
      ],
      "01-01": [
        { id:"sp-ny-01", who:"Oracle", tag:"New Year", text:"New year, same promise: be kind to yourself." }
      ]
    };

    // ---------- recent ids (avoid repeats) ----------
    function getRecentIds(){
      try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); }
      catch { return []; }
    }
    function pushRecentId(id, keep=20){
      const ids = getRecentIds().filter(x => x !== id);
      ids.unshift(id);
      localStorage.setItem(RECENT_KEY, JSON.stringify(ids.slice(0, keep)));
    }

    // ---------- toast ----------
    function toast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 900);
    }

    // ---------- state ----------
    function loadState(){
      try{
        const raw = localStorage.getItem(STATE_KEY);
        if(!raw) return null;
        return JSON.parse(raw);
      }catch{
        return null;
      }
    }
    function saveState(st){
      localStorage.setItem(STATE_KEY, JSON.stringify(st));
    }
    function freshState(){
      const t = today();
      return {
        id: "init",
        text: "A gentle answer will find you.",
        who: "Oracle",
        tag: "Keep going",
        date: t.iso,
        flips: 0
      };
    }

    function render(st){
      ansEl.textContent = st.text;
      whoEl.textContent = st.who;
      stampEl.textContent = st.tag;
      dateEl.textContent = st.date;
      pillEl.textContent = `${st.flips} flips`;
    }

    function chooseAnswer(){
      const t = today();

      // A) fixed-date
      if (SPECIAL[t.md] && SPECIAL[t.md].length){
        return pickOne(SPECIAL[t.md]);
      }

      // B) rare secrets
      let candidates = (Math.random() < SECRET_PROB) ? SECRET_POOL.slice() : POOL.slice();

      // C) avoid repeats
      const recent = new Set(getRecentIds());
      const filtered = candidates.filter(x => !recent.has(x.id));
      const pickFrom = filtered.length ? filtered : candidates;

      return pickOne(pickFrom);
    }

    function animateFlipThen(fn){
      pageEl.classList.add("flip");
      setTimeout(() => {
        fn();
        pageEl.classList.remove("flip");
      }, 320);
    }

    function flipOnce(){
      const ans = chooseAnswer();
      animateFlipThen(() => {
        const t = today();
        state.id = ans.id;
        state.text = ans.text;
        state.who = ans.who;
        state.tag = ans.tag;
        state.date = t.iso;
        state.flips = (state.flips || 0) + 1;

        pushRecentId(ans.id);
        saveState(state);
        render(state);
      });
    }

    function resetAll(){
      localStorage.removeItem(RECENT_KEY);
      localStorage.removeItem(STATE_KEY);
      state = freshState();
      saveState(state);
      render(state);
      toast("Reset.");
    }

    async function copyAnswer(){
      const text = ansEl.textContent || "";
      if (!text.trim()) return;
      try{
        await navigator.clipboard.writeText(text);
        toast("Copied.");
      }catch{
        // fallback
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); toast("Copied."); }
        catch { toast("Copy failed."); }
        document.body.removeChild(ta);
      }
    }

    // ---------- init ----------
    let state = loadState() || freshState();
    // keep date fresh each day
    const t = today();
    state.date = t.iso;
    saveState(state);
    render(state);

    btnFlip.addEventListener("click", flipOnce);
    pageEl.addEventListener("click", flipOnce);

    // long-press to copy (mobile)
    let pressTimer = null;
    pageEl.addEventListener("touchstart", () => {
      pressTimer = setTimeout(() => { copyAnswer(); }, 520);
    }, {passive:true});
    pageEl.addEventListener("touchend", () => {
      if(pressTimer) clearTimeout(pressTimer);
      pressTimer = null;
    });

    btnCopy.addEventListener("click", copyAnswer);
    btnReset.addEventListener("click", resetAll);
  </script>
</body>
</html>
