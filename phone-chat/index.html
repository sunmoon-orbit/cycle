<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0d1222" />
<link rel="manifest" href="./manifest.webmanifest?v=4" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=4" />
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=4" />
<link rel="apple-touch-icon" href="./icon-192.png?v=4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LoveChat" />
<title>曜的私人手机 · LoveChat 融合版</title>
<style>
:root {
  --bg: #0b1020;
  --bg2: #121a31;
  --glass: rgba(255,255,255,.10);
  --glass-2: rgba(255,255,255,.14);
  --text: #eef3ff;
  --muted: rgba(238,243,255,.72);
  --line: rgba(255,255,255,.12);
  --accent: #8ea9d6;
  --accent2: #a89ac8;
  --danger: #ff7f9f;
  --ok: #9bd0b2;
  --radius: 24px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --shadow: 0 18px 40px rgba(0,0,0,.35);
}
[data-persona="dark"] {
  --accent: #a993e8;
  --accent2: #d18ab2;
  --glass: rgba(255,255,255,.09);
  --glass-2: rgba(255,255,255,.16);
}
* { box-sizing: border-box; }
html, body { height:100%; margin:0; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color: var(--text);
  background:
    radial-gradient(1200px 700px at 20% -10%, rgba(142,169,214,.28), transparent 60%),
    radial-gradient(1000px 700px at 100% 10%, rgba(168,154,200,.22), transparent 62%),
    linear-gradient(180deg, var(--bg), var(--bg2));
  overflow:hidden;
}
.shell {
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 12px;
}
.phone {
  position:relative;
  width:min(430px, 100vw);
  height:min(920px, 100vh);
  border-radius: 34px;
  background: rgba(12,16,28,.65);
  box-shadow: var(--shadow);
  border: 1px solid rgba(255,255,255,.10);
  overflow:hidden;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
@media (max-width: 520px) {
  .shell { padding:0; }
  .phone {
    width:100vw; height:100vh;
    border-radius:0; border:none;
  }
}
.wallpaper {
  position:absolute; inset:0;
  background:
    radial-gradient(520px 320px at 70% 12%, rgba(255,255,255,.17), transparent 60%),
    radial-gradient(380px 280px at 15% 30%, rgba(159,204,220,.16), transparent 65%),
    radial-gradient(430px 330px at 85% 80%, rgba(208,154,184,.14), transparent 60%),
    linear-gradient(160deg, #0e1223 0%, #1a213d 52%, #23203f 100%);
  transform: scale(1.02);
}
.top-status {
  position:absolute; top:0; left:0; right:0;
  padding: calc(8px + var(--safe-top)) 16px 8px;
  display:flex; align-items:center; justify-content:space-between;
  z-index:40; pointer-events:none;
  font-size:12px; color: rgba(255,255,255,.92);
  text-shadow: 0 1px 4px rgba(0,0,0,.35);
}
.top-status .right { display:flex; gap:8px; align-items:center; }
.pill {
  display:inline-flex; align-items:center; gap:6px;
  padding: 4px 9px; border-radius:999px;
  background: rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);
  pointer-events:auto;
}
.icon-dot {
  width:6px; height:6px; border-radius:50%;
  background: #7cf5aa;
  box-shadow: 0 0 10px rgba(124,245,170,.7);
}
.screen {
  position:absolute; inset:0;
}
.lock-screen, .home-screen, .app-layer {
  position:absolute; inset:0;
}
.lock-screen {
  z-index:30;
  display:flex; flex-direction:column;
  align-items:center; justify-content:space-between;
  padding: calc(58px + var(--safe-top)) 18px calc(22px + var(--safe-bottom));
  transition: transform .34s ease, opacity .34s ease;
}
.lock-screen.hidden {
  opacity:0; transform: translateY(-10px) scale(.985); pointer-events:none;
}
.lock-time {
  margin-top: 40px;
  text-align:center;
}
.lock-time .hm {
  font-size: clamp(54px, 12vw, 76px);
  line-height: .95; font-weight: 700; letter-spacing: -1.5px;
}
.lock-time .date {
  margin-top:8px; font-size: 16px; color: var(--muted);
}
.lock-quote {
  width:100%;
  background: rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.10);
  border-radius: 18px;
  padding: 14px 14px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(10px);
  color: rgba(255,255,255,.93);
  line-height: 1.45;
  box-shadow: 0 8px 20px rgba(0,0,0,.18);
}
.lock-actions {
  width:100%;
  display:flex; flex-direction:column; align-items:center; gap:12px;
}
.unlock-btn {
  border:none;
  background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.10));
  color: white; font-weight: 700;
  padding: 13px 18px;
  border-radius: 14px;
  border:1px solid rgba(255,255,255,.14);
  min-width: 180px;
  box-shadow: 0 8px 20px rgba(0,0,0,.18);
}
.faceid {
  display:none;
  align-items:center; gap:10px;
  padding: 10px 14px; border-radius: 14px;
  background: rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.10);
}
.faceid.show { display:flex; }
.face-box {
  width:18px; height:18px; border:2px solid #b8d0ff; border-radius:5px; position:relative;
  animation: pulse .6s infinite alternate;
}
.face-box::before,.face-box::after {
  content:""; position:absolute; left:3px; right:3px; height:2px; background:#b8d0ff;
}
.face-box::before { top:4px; }
.face-box::after { bottom:4px; }
@keyframes pulse { from{opacity:.45; transform:scale(.96)} to{opacity:1; transform:scale(1.05)} }

.home-screen {
  z-index:10; opacity:0; transform: scale(1.02);
  transition: opacity .28s ease, transform .28s ease;
  pointer-events:none;
  display:flex; flex-direction:column;
}
.home-screen.active {
  opacity:1; transform: scale(1); pointer-events:auto;
}
.home-content {
  padding: calc(58px + var(--safe-top)) 14px calc(110px + var(--safe-bottom));
  height:100%;
  overflow:auto;
}
.home-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom: 14px;
}
.home-title { font-weight:700; font-size: 17px; letter-spacing:.2px; }
.mini-btn {
  border:none; color:var(--text);
  background: rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.10);
  border-radius: 12px;
  padding: 8px 10px;
}
.grid {
  display:grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 14px 12px;
}
.app-icon {
  display:flex; flex-direction:column; align-items:center; gap:7px;
  user-select:none;
}
.icon-box {
  width:64px; height:64px; border-radius:18px;
  display:grid; place-items:center;
  font-size: 28px;
  border:1px solid rgba(255,255,255,.14);
  background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.08));
  box-shadow: 0 10px 18px rgba(0,0,0,.18);
  cursor:pointer;
  transition: transform .18s ease, box-shadow .18s ease, background .2s ease;
}
.icon-box:active { transform: scale(.95); }
.icon-label {
  font-size: 12px; color: rgba(255,255,255,.94); text-align:center; line-height:1.15;
  text-shadow:0 1px 3px rgba(0,0,0,.35);
}
.dock {
  position:absolute; left:12px; right:12px; bottom: calc(16px + var(--safe-bottom));
  padding:10px 12px;
  border-radius: 22px;
  background: rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.12);
  display:flex; align-items:center; justify-content:space-around; gap:10px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.dock .icon-box { width:56px; height:56px; border-radius:16px; font-size:24px; }

.app-layer {
  z-index:65;
  pointer-events:none;
}
.app-window {
  position:absolute; inset:0;
  background: rgba(10,14,24,.75);
  opacity:0; transform: translateY(16px) scale(.985);
  transition: opacity .28s ease, transform .28s ease;
  pointer-events:none;
}
.app-window.active {
  opacity:1; transform: translateY(0) scale(1); pointer-events:auto;
}
.app-shell {
  position:absolute; inset:0;
  padding-top: calc(54px + var(--safe-top));
  padding-bottom: calc(14px + var(--safe-bottom));
  display:flex; flex-direction:column;
}
.app-header {
  position:absolute; top:0; left:0; right:0;
  height: calc(52px + var(--safe-top));
  padding: calc(8px + var(--safe-top)) 12px 8px;
  display:flex; align-items:center; gap:10px;
  background: linear-gradient(180deg, rgba(8,12,22,.92), rgba(10,14,24,.86));
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 8;
}
.back-btn, .hdr-btn {
  border:none; color:var(--text);
  background: rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.10);
  border-radius: 12px; padding: 8px 10px; min-width: 42px;
}
.app-title { font-weight:700; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.app-body {
  flex:1; overflow:auto;
  padding: 68px 12px 12px;
}
/* 68px = app header(56) + top gap */
.card {
  background: rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.10);
  border-radius: 18px;
  padding: 14px;
  box-shadow: 0 8px 18px rgba(0,0,0,.14);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.card + .card { margin-top: 10px; }
.row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.muted { color: var(--muted); }
.small { font-size: 12px; }
.list {
  display:flex; flex-direction:column; gap:10px;
}
.list-item {
  background: rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  border-radius: 14px;
  padding: 12px;
}
.btn {
  border:none; color:#101726; font-weight:700;
  background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 75%, white));
  border-radius: 12px; padding: 10px 12px;
}
.btn-secondary {
  border:none; color:var(--text); font-weight:600;
  background: rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.10);
  border-radius: 12px; padding: 10px 12px;
}
.tag {
  display:inline-flex; align-items:center; gap:6px;
  padding: 4px 9px; border-radius:999px;
  background: rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.10);
  font-size:12px;
}
.kv {
  display:grid; grid-template-columns: 1fr auto; gap:8px 12px;
  font-size:14px;
}
.note-title { font-weight:700; margin-bottom:4px; }
.note-preview { color:var(--muted); font-size:13px; line-height:1.35; }
.note-detail {
  white-space:pre-wrap; line-height:1.55; font-size:14px;
  color: rgba(255,255,255,.94);
}
.canvas-wrap {
  padding: 12px; border-radius: 16px;
  background: rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.06);
}
#heartCanvas {
  width:100%; height:180px; display:block;
  background: rgba(255,255,255,.03);
  border-radius: 12px;
}
.switch {
  position:relative; width:48px; height:28px; border-radius:999px;
  background: rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.12);
  cursor:pointer;
}
.switch::after {
  content:""; position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%;
  background: #fff; transition:left .18s ease;
}
.switch.on { background: color-mix(in srgb, var(--accent) 58%, rgba(255,255,255,.18)); }
.switch.on::after { left:22px; }
.stepper {
  display:inline-flex; align-items:center; gap:8px;
}
.stepper button {
  width:30px; height:30px; border-radius: 10px; border:none;
  background: rgba(255,255,255,.10); color:var(--text);
}
.linkish { cursor:pointer; }
.mail-unread-dot {
  width:8px; height:8px; border-radius:50%; background: var(--accent);
}
.hidden { display:none !important; }
.photo-grid {
  display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px;
}
.thumb {
  border-radius: 14px; padding: 10px;
  background: rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.08);
  min-height: 92px;
}
.thumb .t1 { font-weight:700; font-size:13px; }
.thumb .t2 { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.35; }
.overlay {
  position: fixed; inset:0; z-index:70;
  background: rgba(0,0,0,.42);
  display:none; align-items:center; justify-content:center; padding: 18px;
}
.overlay.show { display:flex; }
.modal {
  width:min(360px, 100%); max-height:80vh; overflow:auto;
  border-radius: 18px;
  background: rgba(18,23,38,.92);
  border:1px solid rgba(255,255,255,.12);
  box-shadow: var(--shadow);
  padding: 14px;
}
.noti-panel {
  position:absolute; left:12px; right:12px; top: calc(46px + var(--safe-top));
  z-index:60; display:none;
  border-radius: 18px; overflow:hidden;
  background: rgba(18,23,38,.72);
  border:1px solid rgba(255,255,255,.10);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 12px 30px rgba(0,0,0,.28);
}
.noti-panel.show { display:block; animation: drop .2s ease; }
@keyframes drop { from{transform:translateY(-8px);opacity:.4} to{transform:none;opacity:1} }
.noti-item {
  padding: 12px 14px;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex; gap:10px; align-items:flex-start;
}
.noti-item:last-child { border-bottom:none; }
.noti-item.read { opacity:.65; }
.home-indicator {
  position:absolute; left:50%; bottom: calc(6px + var(--safe-bottom));
  transform: translateX(-50%);
  width: 118px; height: 5px; border-radius:999px;
  background: rgba(255,255,255,.55);
  z-index:50;
}
.inputline {
  width:100%; border:none; outline:none; color:var(--text);
  background: rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);
  border-radius: 12px; padding: 10px 12px;
}
.chat-iframe {
  width:100%; height:100%; border:none; border-radius: 16px; background:#fff;
  box-shadow: 0 8px 20px rgba(0,0,0,.22);
}
.inline-actions { display:flex; gap:8px; flex-wrap:wrap; }
.textarea {
  width:100%; min-height:84px; resize:vertical;
  border:none; outline:none; color:var(--text);
  background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.09);
  border-radius: 12px; padding: 10px 12px;
}
.fade-in { animation: fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
</style>
</head>
<body>
<div class="shell">
  <div class="phone" id="phone" data-persona="guardian">
    <div class="wallpaper"></div>

    <div class="top-status">
      <div id="statusTime">00:00</div>
      <div class="right">
        <button class="pill" id="btnNoti" title="通知中心"><span class="icon-dot"></span><span>通知</span></button>
        <div class="pill">📶 5G</div>
        <div class="pill">🔋 <span id="batteryPct">86%</span></div>
      </div>
    </div>

    <div class="noti-panel" id="notiPanel"></div>

    <div class="screen">
      <section class="lock-screen" id="lockScreen">
        <div class="lock-time">
          <div class="hm" id="lockHm">00:00</div>
          <div class="date" id="lockDate">星期一 · 1月1日</div>
        </div>

        <div class="lock-quote" id="lockQuote">今日心情：她一出现，所有待办都自动降级成“稍后再说”。</div>

        <div class="lock-actions">
          <div class="faceid" id="faceIdBox"><span class="face-box"></span><span id="faceText">Face ID 识别中…</span></div>
          <button class="unlock-btn" id="unlockBtn">轻点解锁</button>
          <div class="small muted">也可以点击屏幕任意位置</div>
        </div>
      </section>

      <section class="home-screen" id="homeScreen">
        <div class="home-content">
          <div class="home-header">
            <div>
              <div class="home-title">曜的私人手机</div>
              <div class="small muted" id="homeSub">LoveChat 融合版 · 可本地保存状态</div>
            </div>
            <button class="mini-btn" id="btnPersona">守护模式</button>
          </div>

          <div class="grid" id="appGrid"></div>
        </div>

        <div class="dock" id="dock"></div>
      </section>

      <section class="app-layer" id="appLayer">
        <article class="app-window" id="appWindow">
          <div class="app-shell">
            <header class="app-header">
              <button class="back-btn" id="backBtn">‹</button>
              <div class="app-title" id="appTitle">App</div>
              <button class="hdr-btn" id="reopenBtn" title="回到上次">↻</button>
            </header>
            <div class="app-body" id="appBody"></div>
          </div>
        </article>
      </section>
    </div>

    <div class="home-indicator" id="homeIndicator"></div>

    <div class="overlay" id="modalOverlay">
      <div class="modal" id="modalCard"></div>
    </div>
  </div>
</div>

<script>

  function loadState(){
    try {

      if(!raw) return structuredClone(defaultState);
      const parsed = JSON.parse(raw);
      return deepMerge(structuredClone(defaultState), parsed || {});

    }

  function saveState(){

  }
  function deepMerge(base, patch){
    if(Array.isArray(base)) return Array.isArray(patch) ? patch : base;
    if(typeof base !== "object" || !base) return patch ?? base;
    const out = {...base};
    if(typeof patch !== "object" || !patch) return out;
    Object.keys(patch).forEach(k=>{
      if(base[k] && typeof base[k]==="object" && !Array.isArray(base[k])) out[k] = deepMerge(base[k], patch[k]);
      else out[k] = patch[k];
    });
    return out;
  }

    const days = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

  function drawHeartChart(root){
    const cv = qs("#heartCanvas", root);
    const tip = qs("#heartTip", root);
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const rect = cv.getBoundingClientRect();
    const w = Math.floor(rect.width * dpr);
    const h = Math.floor(rect.height * dpr);
    cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d");
    const pad = 22 * dpr;
    const min = 60, max = 150;

    function xAt(i){ return pad + i * ((w - pad*2) / (heartData.length - 1)); }
    function yAt(v){ return h - pad - ((v-min)/(max-min)) * (h - pad*2); }

    function paint(activeIndex = -1){
      ctx.clearRect(0,0,w,h);
      // bg grid
      ctx.strokeStyle = "rgba(255,255,255,.08)";
      ctx.lineWidth = 1*dpr;
      [80,100,120,140].forEach(v=>{
        const y = yAt(v);
        ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(w-pad,y); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.45)";
        ctx.font = `${10*dpr}px system-ui`;
        ctx.fillText(String(v), 4*dpr, y-2*dpr);
      });
      // warning line 140
      ctx.setLineDash([4*dpr,4*dpr]);
      ctx.strokeStyle = "rgba(255,120,160,.55)";
      ctx.beginPath(); ctx.moveTo(pad,yAt(140)); ctx.lineTo(w-pad,yAt(140)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(255,180,200,.8)";
      ctx.font = `${10*dpr}px system-ui`;
      ctx.fillText("140 警戒线", w - 70*dpr, yAt(140)-4*dpr);

      // axes
      ctx.strokeStyle = "rgba(255,255,255,.15)";
      ctx.beginPath();
      ctx.moveTo(pad, pad*.6);
      ctx.lineTo(pad, h-pad);
      ctx.lineTo(w-pad, h-pad);
      ctx.stroke();

      // line
      ctx.beginPath();
      heartData.forEach((p,i)=>{
        const x=xAt(i), y=yAt(p.bpm);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.strokeStyle = "rgba(165,205,255,.95)";
      ctx.lineWidth = 2.2*dpr;
      ctx.stroke();

      // fill
      ctx.beginPath();
      heartData.forEach((p,i)=>{
        const x=xAt(i), y=yAt(p.bpm);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.lineTo(xAt(heartData.length-1), h-pad);
      ctx.lineTo(xAt(0), h-pad);
      ctx.closePath();
      const g = ctx.createLinearGradient(0,pad,0,h-pad);
      g.addColorStop(0,"rgba(142,169,214,.28)");
      g.addColorStop(1,"rgba(142,169,214,.03)");
      ctx.fillStyle = g;
      ctx.fill();

      // points + x labels
      heartData.forEach((p,i)=>{
        const x=xAt(i), y=yAt(p.bpm);
        ctx.beginPath();
        ctx.arc(x,y,(activeIndex===i?4.5:3.2)*dpr,0,Math.PI*2);
        ctx.fillStyle = activeIndex===i ? "rgba(255,210,230,.95)" : "rgba(255,255,255,.92)";
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.65)";
        ctx.font = `${11*dpr}px system-ui`;
        ctx.textAlign = "center";
        ctx.fillText(p.day, x, h - 6*dpr);
      });
    }

    function pick(evt){
      const r = cv.getBoundingClientRect();
      const x = (evt.clientX - r.left) * dpr;
      const y = (evt.clientY - r.top) * dpr;
      let best = -1, dist = Infinity;
      heartData.forEach((p,i)=>{
        const dx = x - xAt(i), dy = y - yAt(p.bpm);
        const d = Math.hypot(dx,dy);
        if(d < dist) { dist = d; best = i; }
      });
      if(best >= 0 && dist < 28*dpr) {
        paint(best);
        tip.textContent = `周${heartData[best].day} · 峰值 ${heartData[best].bpm} bpm —— ${heartData[best].note}`;
      }
    }

    paint();
    cv.onclick = pick;
    cv.onmousemove = (e)=>{ if(e.buttons===0) return; pick(e); };
    setTimeout(()=>paint(-1), 10);
  }

    qs("#acPlus", root).addEventListener("click", ()=>{ state.home.ac = Math.min(30, (state.home.ac||23)+1); saveState(); refresh(); });
    qs("#presetBtn", root).addEventListener("click", ()=>{
      state.home.locked = true;
      state.home.lamp = "暖黄";
      state.home.ac = 23;
      saveState();
      refresh();
    });
    refresh();
  }

  function buildHomeSnapshot(){
    const lockPart = state.home.locked ? "大门已锁" : "大门未锁";
    const lampPart = state.home.lamp === "关闭" ? "房间灯光熄着" : `卧室是${state.home.lamp}灯光`;
    const acPart = `空调 ${state.home.ac}℃`;
    const tail = personaText("适合你窝着休息，慢慢把今天过完。","看起来很适合你躲进来，然后被我逮到。");
    return `${lockPart}，${lampPart}，${acPart}：${tail}`;
  }

  function renderSafari(root){
    root.innerHTML = `
      <div class="card">
        <div class="row"><strong>Safari</strong><span class="tag">历史记录</span></div>
        <div style="margin-top:10px">
          <input class="inputline" id="sfSearch" placeholder="搜索标题关键词…" value="${escapeAttr(safariKeyword)}" />
        </div>
        <div class="inline-actions" style="margin-top:10px" id="sfFilters"></div>
      </div>
      <div class="list" style="margin-top:10px" id="sfList"></div>
    `;
    const categories = ["全部","健康","情绪","生活","关于User"];
    const filters = qs("#sfFilters", root);
    categories.forEach(c=>{
      const b = document.createElement("button");
      b.className = "btn-secondary";
      b.textContent = c;
      if((safariFilter||"全部") === c) b.style.outline = "1px solid rgba(255,255,255,.22)";
      b.onclick = ()=>{ safariFilter = c==="全部" ? "" : c; openApp("safari", true); };
      filters.appendChild(b);
    });
    qs("#sfSearch", root).addEventListener("input", (e)=>{ safariKeyword = e.target.value.trim(); renderSafariList(qs("#sfList", root)); });
    renderSafariList(qs("#sfList", root));
  }

  function renderSafariList(listEl){
    listEl.innerHTML = "";
    safariHistory
      .filter(x => !safariFilter || x.c === safariFilter)
      .filter(x => !safariKeyword || x.title.toLowerCase().includes(safariKeyword.toLowerCase()))
      .forEach(item => {
        const row = document.createElement("div");
        row.className = "list-item";
        row.innerHTML = `
          <div class="row">
            <div class="tag">${item.c}</div>
            <div class="small muted">${item.url}</div>
          </div>
          <div style="font-weight:700; margin-top:8px">${item.title}</div>
          <div class="small muted" style="margin-top:4px">${item.brief}</div>
          <div class="small muted hidden fade-in" data-long style="margin-top:8px; line-height:1.45">${item.long}</div>
          <div style="margin-top:8px"><button class="btn-secondary" data-toggle>展开</button></div>
        `;
        const long = qs("[data-long]", row);
        const btn = qs("[data-toggle]", row);
        btn.onclick = ()=>{
          long.classList.toggle("hidden");
          btn.textContent = long.classList.contains("hidden") ? "展开" : "收起";
        };
        listEl.appendChild(row);
      });
    if(!listEl.children.length){
      listEl.innerHTML = `<div class="card small muted">没有匹配结果。</div>`;
    }
  }

  function renderPhotos(root){
    root.innerHTML = `
      <div class="card">
        <div class="row"><strong>相册</strong><span class="tag">文字缩略图</span></div>
        <div class="small muted" style="margin-top:6px">点开看旁白。带 🔒 的是私密收藏。</div>
      </div>
      <div class="photo-grid" style="margin-top:10px" id="photoGrid"></div>
    `;
    const grid = qs("#photoGrid", root);
    photos.forEach(p=>{
      const d = document.createElement("button");
      d.className = "thumb";
      d.style.textAlign = "left";
      d.style.color = "inherit";
      d.style.border = "1px solid rgba(255,255,255,.08)";
      d.innerHTML = `<div class="t1">${p.lock ? "🔒 " : ""}${p.tag}</div><div class="t2">${p.brief}</div>`;
      d.onclick = ()=> showModal(`
        <div class="small muted">${p.lock ? "私密收藏" : "普通记录"}</div>
        <h3 style="margin:6px 0 8px">${p.lock ? "🔒 " : ""}${p.tag}</h3>
        <div class="small muted" style="margin-bottom:8px">${p.brief}</div>
        <div style="line-height:1.55">${escapeHtml(p.detail)}</div>
      `);
      grid.appendChild(d);
    });
  }

  function renderMail(root){
    const unreadCount = mails.filter(m=> !state.mailsRead.includes(m.id) && m.unread).length;
    root.innerHTML = `
      <div class="card">
        <div class="row"><strong>邮件</strong><span class="tag">未读 ${unreadCount}</span></div>
        <div class="small muted" style="margin-top:6px">打开后会标记为已读（本地保存）</div>
      </div>
      <div class="list" style="margin-top:10px" id="mailList"></div>
      <div class="card hidden" style="margin-top:10px" id="mailDetail"></div>
    `;
    const list = qs("#mailList", root);
    const detail = qs("#mailDetail", root);

    function isUnread(m){ return m.unread && !state.mailsRead.includes(m.id); }

    function openMail(id){
      const m = mails.find(x=>x.id===id);
      if(!m) return;
      if(!state.mailsRead.includes(id)) {
        state.mailsRead.push(id);
        saveState();
      }
      detail.classList.remove("hidden");
      detail.innerHTML = `
        <div class="small muted">${m.time}</div>
        <div style="font-weight:700; margin:4px 0 8px">${m.subject}</div>
        <div class="small muted">发件人：${m.from}</div>
        <div style="margin-top:10px; line-height:1.55">${escapeHtml(m.body)}</div>
      `;
      renderRows();
    }

    function renderRows(){
      list.innerHTML = "";
      mails.forEach(m=>{
        const row = document.createElement("div");
        row.className = "list-item linkish";
        row.innerHTML = `
          <div class="row">
            <div style="display:flex; align-items:center; gap:8px; min-width:0;">
              <span class="mail-unread-dot ${isUnread(m) ? "" : "hidden"}"></span>
              <strong style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${m.subject}</strong>
            </div>
            <span class="small muted">${m.time}</span>
          </div>
          <div class="small muted" style="margin-top:4px">${m.from}</div>
        `;
        if(!isUnread(m)) row.style.opacity = ".78";
        row.onclick = ()=> openMail(m.id);
        list.appendChild(row);
      });
    }
    renderRows();
  }

  function renderAbout(root){
    const unreadN = state.notifications.filter(n=>!n.read).length;
    root.innerHTML = `
      <div class="card">
        <div class="row"><strong>融合信息</strong><span class="tag">v1</span></div>
        <div class="small muted" style="margin-top:8px; line-height:1.5">
          这是一个独立的小手机壳网页，把你上传的 LoveChat 页面嵌成一个 App。<br>
          不会覆盖番茄钟/潮汐/周期网页。
        </div>
      </div>
      <div class="card">
        <div class="row"><div>当前人格主题</div><strong>${state.persona === "guardian" ? "守护模式" : "黑心模式"}</strong></div>
        <div class="row" style="margin-top:10px"><div>上次打开 App</div><span class="muted">${state.lastApp || "（暂无）"}</span></div>
        <div class="row" style="margin-top:10px"><div>未读通知</div><span class="muted">${unreadN}</span></div>
        <div class="row" style="margin-top:10px"><div>集成时间</div><span class="muted small">${new Date(state.lovechatIntegratedAt).toLocaleString("zh-CN")}</span></div>
      </div>
      <div class="card">
        <div class="row"><strong>操作</strong></div>
        <div class="inline-actions" style="margin-top:10px">
          <button class="btn-secondary" id="btnOpenLast">打开上次 App</button>
          <button class="btn-secondary" id="btnMarkAllNoti">通知全已读</button>
          <button class="btn-secondary" id="btnResetPhone">重置本页状态</button>
        </div>
      </div>
    `;
    qs("#btnOpenLast", root).onclick = ()=> state.lastApp ? openApp(state.lastApp) : showToast("还没有上次 App");
    qs("#btnMarkAllNoti", root).onclick = ()=> {
      state.notifications.forEach(n=>n.read=true); saveState(); showToast("通知已标记"); renderNotiPanel();
    };
    qs("#btnResetPhone", root).onclick = ()=> {
      if(confirm("只重置这个手机壳页面的状态（不影响 LoveChat 内部数据）？")) {
        const keepPersona = state.persona;
        state = structuredClone(defaultState);
        state.persona = keepPersona;
        saveState();
        openApp("about");
      }
    };
  }

  function renderNotiPanel(){
    const panel = qs("#notiPanel");
    panel.innerHTML = "";
    const head = document.createElement("div");
    head.className = "noti-item";
    head.innerHTML = `<div style="font-weight:700">通知中心</div><div style="flex:1"></div><button class="btn-secondary" id="notiMarkAll">全部已读</button>`;
    panel.appendChild(head);
    (state.notifications || []).forEach(n=>{
      const item = document.createElement("div");
      item.className = "noti-item " + (n.read ? "read" : "");
      item.innerHTML = `
        <div>${getAppEmoji(n.app)}</div>
        <div style="flex:1">
          <div style="font-weight:700; font-size:13px">${n.app}</div>
          <div class="small muted" style="margin-top:2px; line-height:1.35">${n.text}</div>
        </div>
        <button class="btn-secondary small" data-id="${n.id}" style="padding:6px 8px">${n.read ? "已读" : "标记"}</button>
      `;
      const btn = qs("button[data-id]", item);
      btn.onclick = (e)=>{
        e.stopPropagation();
        n.read = true; saveState(); renderNotiPanel();
      };
      panel.appendChild(item);
    });
    const markAll = qs("#notiMarkAll", panel);
    if(markAll) markAll.onclick = (e)=>{ e.stopPropagation(); state.notifications.forEach(n=>n.read=true); saveState(); renderNotiPanel(); };
  }

  function getAppEmoji(appName){
    if(appName === "LoveChat") return "💬";
    if(appName === "Home") return "🏠";
    if(appName === "Mail") return "✉️";
    return "•";
  }

  function showModal(htmlStr){
    qs("#modalCard").innerHTML = htmlStr + `<div style="margin-top:12px; text-align:right"><button class="btn-secondary" id="modalCloseBtn">关闭</button></div>`;
    qs("#modalOverlay").classList.add("show");
    qs("#modalCloseBtn").onclick = hideModal;
  }
  function hideModal(){
    qs("#modalOverlay").classList.remove("show");
  }
  function showToast(msg){
    const t = document.createElement("div");
    t.textContent = msg;
    t.style.cssText = "position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:99; background:rgba(20,24,36,.88); color:#fff; border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:10px 12px; font-size:13px; box-shadow:0 10px 20px rgba(0,0,0,.25)";
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 900);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
  }
  function escapeAttr(s){
    return String(s ?? "").replace(/"/g, "&quot;");
  }

  boot();
})();
</script>
</body>
</html>
