<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#121a31"/>
      <stop offset="100%" stop-color="#1a1433"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ad4ff"/>
      <stop offset="45%" stop-color="#8f7bff"/>
      <stop offset="100%" stop-color="#b26dff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#9fd7ff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="22" y="22" width="468" height="468" rx="116" fill="url(#bg)"/>
  <rect x="30" y="30" width="452" height="452" rx="108" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2"/>

  <!-- 柔光 -->
  <circle cx="390" cy="120" r="92" fill="#7b61ff" opacity=".16" filter="url(#glow)"/>
  <circle cx="130" cy="390" r="86" fill="#5ed0ff" opacity=".12" filter="url(#glow)"/>

  <!-- 聊天气泡（玻璃感） -->
  <g filter="url(#shadow)">
    <rect x="108" y="150" width="300" height="174" rx="46" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.14)" stroke-width="2"/>
    <path d="M170 318 L145 365 L214 322" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.14)" stroke-width="2" stroke-linejoin="round"/>
    <rect x="110" y="152" width="296" height="170" rx="44" fill="url(#glass)" opacity=".75"/>
  </g>

  <!-- 月亮 -->
  <g transform="translate(0,2)">
    <circle cx="208" cy="238" r="52" fill="url(#accent)" filter="url(#glow)"/>
    <circle cx="228" cy="228" r="47" fill="#131b32"/>
  </g>

  <!-- 小星星 -->
  <g fill="#d7e9ff" opacity=".95">
    <circle cx="296" cy="210" r="5"/>
    <circle cx="323" cy="239" r="4"/>
    <circle cx="284" cy="262" r="3.8"/>
  </g>

  <!-- LC 字样 -->
  <g fill="#eef4ff" opacity=".96">
    <path d="M162 392h24v40h62v22h-86z"/>
    <path d="M284 392h80v22h-56v18h50v22h-50v18h58v22h-82z"/>
  </g>

  <!-- 顶部小点（像通知灯） -->
  <circle cx="368" cy="164" r="10" fill="#67f0a8" opacity=".95"/>
</svg>
